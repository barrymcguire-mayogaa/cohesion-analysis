// ── Stats tab: Expected points (xP) section — period-aware via statPred ──
function dashXpChartSvg(S,hC,aC){
  const X=S.X, sh=X.shots.filter(o=>statPred(o.e)&&o.min!=null).sort((p,q)=>p.min-q.min);
  if(!sh.length) return '';
  const mins=ALL.filter(e=>statSide(e)&&statPred(e)).map(e=>{ const m=/^([12])H\s+(\d+):(\d+)/.exec(e.gameTime||''); if(!m) return null;
    const mn=+m[2]+(+m[3])/60; return +m[1]===1?mn:X.h1len+mn; }).filter(v=>v!=null);
  let x0=Math.floor(Math.min(...mins,sh[0].min)), x1=Math.ceil(Math.max(...mins,sh[sh.length-1].min));
  if(x1-x0<5) x1=x0+5;
  const series={h:{p:[[x0,0]],x:[[x0,0]]},a:{p:[[x0,0]],x:[[x0,0]]}}, tot={h:{p:0,x:0},a:{p:0,x:0}};
  sh.forEach(o=>{ const t=tot[o.s], z=series[o.s];
    if(o.pts){ t.p+=o.pts; z.p.push([o.min,t.p]); }
    if(o.xp!=null){ t.x+=o.xp; z.x.push([o.min,t.x]); } });
  ['h','a'].forEach(s=>{ series[s].p.push([x1,tot[s].p]); series[s].x.push([x1,tot[s].x]); });
  const W=320,H=132,ML=24,MR=8,MT=8,MB=18, maxV=Math.max(4,tot.h.p,tot.a.p,tot.h.x,tot.a.x);
  const X_=m=>ML+(m-x0)/(x1-x0)*(W-ML-MR), Y_=v=>MT+(H-MT-MB)*(1-v/maxV);
  const step=pts=>pts.map((p,i)=>(i?'L'+X_(p[0]).toFixed(1)+' '+Y_(pts[i-1][1]).toFixed(1)+' ':'M')+X_(p[0]).toFixed(1)+' '+Y_(p[1]).toFixed(1)).join(' ');
  const ys=maxV<=10?2:maxV<=25?5:10, xs=(x1-x0)<=20?5:(x1-x0)<=45?10:15;
  let g='';
  for(let v=0;v<=maxV;v+=ys) g+=`<line x1="${ML}" x2="${W-MR}" y1="${Y_(v)}" y2="${Y_(v)}" stroke="var(--border)" stroke-width=".6"/><text x="${ML-4}" y="${Y_(v)+3}" font-size="8" text-anchor="end" fill="var(--t3)">${v}</text>`;
  for(let m=Math.ceil(x0/xs)*xs;m<=x1;m+=xs) g+=`<text x="${X_(m)}" y="${H-5}" font-size="8" text-anchor="middle" fill="var(--t3)">${m}'</text>`;
  const line=(d,col,dash)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${dash?1.6:2.2}" ${dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round"/>`;
  return `<svg class="stt-xpc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running points and expected points">${g}`
    +line(step(series.h.x),hC,true)+line(step(series.a.x),aC,true)+line(step(series.h.p),hC,false)+line(step(series.a.p),aC,false)+`</svg>`
    +`<div class="stt-xpleg"><span>━ points</span><span>╌ xP (running)</span></div>`;
}
function dashXpSectionHtml(){
  const S=dashXpSummary(statPred);
  const title='Expected points (xP)';
  if(!S) return statSection(title,'','<div class="stt-none">The xP model did not load.</div>');
  const {h,a}=S;
  if(!h.shots&&!a.shots) return statSection(title,'','');
  const hC=GAME.homeColor||'#2563eb', aC=GAME.awayColor||'#22c55e';
  const H=tc(GAME.homeTeam||'Home'), A=tc(GAME.awayTeam||'Away');
  const line=(t,nm,col)=>{
    if(!t.n) return `<div class="stt-xpl"><b style="color:${col}">${esc(nm)}</b> ${t.score} (${t.ptsAll}) · no located shots, no xP</div>`;
    const d=Math.round(t.diff*10)/10;
    return `<div class="stt-xpl"><b style="color:${col}">${esc(nm)}</b> ${t.score} (${t.ptsAll}) from <b>${dashXpF(t.xp)}</b> xP · <span class="${d>0?'pos':d<0?'neg':''}">${dashXpSigned(t.diff)}</span>${t.miss?` <small style="color:var(--t3)">(${t.pts} of ${t.ptsAll} pts from modelled shots)</small>`:''}</div>`;
  };
  const row=(lab,hv,av,hw,aw)=>{ const m=Math.max(Math.abs(hw),Math.abs(aw),1e-9);
    return `<div class="stt-row xp"><span class="stt-n">${hv}</span><span class="stt-bar r"><span style="width:${Math.abs(hw)/m*100}%;background:${hC}"></span></span><span class="stt-k">${lab}</span><span class="stt-bar"><span style="width:${Math.abs(aw)/m*100}%;background:${aC}"></span></span><span class="stt-n">${av}</span></div>`; };
  let body=line(h,H,hC)+line(a,A,aC);
  body+=row('xP',dashXpF(h.xp),dashXpF(a.xp),h.xp,a.xp);
  body+=row('Points − xP',h.n?dashXpSigned(h.diff):'—',a.n?dashXpSigned(a.diff):'—',h.n?h.diff:0,a.n?a.diff:0);
  body+=row('xP per shot',h.perShot!=null?h.perShot.toFixed(2):'—',a.perShot!=null?a.perShot.toFixed(2):'—',h.perShot||0,a.perShot||0);
  const cell=c=>c.n?`${c.pts} / ${dashXpF(c.xp)} <small>(${c.n})</small>`:'<small>—</small>';
  const cats=DASH_XP_CATS.filter(([k])=>h.cat[k].n||a.cat[k].n);
  if(cats.length) body+=`<table class="stt-xpt"><tr><th>pts / xP (shots)</th><th></th><th>pts / xP (shots)</th></tr>`
    +cats.map(([k,lab])=>`<tr><td>${cell(h.cat[k])}</td><td class="k">${lab}</td><td>${cell(a.cat[k])}</td></tr>`).join('')+`</table>`;
  body+=dashXpChartSvg(S,hC,aC);
  body+=`<div class="stt-xpn">Model v${esc(S.version)}${S.conv==='sportscode_rot'?' · rotated Sportscode coordinates detected':''} · ${S.miss?S.miss+' shot'+(S.miss>1?'s':'')+' without location/attempt → not in xP':'every shot located'}</div>`;
  return statSection(title,'',body);
}

// Dashboard tag edits are BATCHED: each change updates the event in memory
// and a localStorage backup, then all changes push to the database in ONE
// authenticated call when the user leaves (the Save & leave prompt). Nothing
// is written per-keystroke. (Direct browser writes are blocked by RLS and
// fail silently anyway; batching goes through the service-role editEvent.)
let dashPending = new Map();               // rowId -> full event data to persist
function dashBackupKey(){ return 'coh_dash_'+gameId; }
function dashCleanEv(ev){ const d={...ev}; delete d._rowId; return d; }
function dashPersistBackup(){
  try{
    if(dashPending.size) localStorage.setItem(dashBackupKey(), JSON.stringify(Object.fromEntries(dashPending)));
    else localStorage.removeItem(dashBackupKey());
  }catch(_){}
}
function updateDashUnsaved(){
  const el=document.getElementById('dashUnsaved');
  const btn=document.getElementById('dashSaveBtn');
  const n=dashPending.size;
  if(el){ el.style.display = n ? '' : 'none'; el.style.color='var(--orange,#ff9800)'; el.textContent = n ? ('● '+n+' unsaved') : ''; }
  if(btn){ btn.style.display = n ? '' : 'none'; btn.disabled=false; btn.textContent='💾 Save ('+n+')'; }
}
function queueEventEdit(ev){ dashXpInvalidate(); dashPending.set(ev._rowId, dashCleanEv(ev)); dashPersistBackup(); updateDashUnsaved(); }
async function saveAllDash(){
  if(!dashPending.size) return;
  const ops=[...dashPending.entries()].map(([id,data])=>({action:'update',id,data,ref:id}));
  const { results } = await cohesionEventBatch(ops);
  results.filter(r=>r.ok).forEach(r=>dashPending.delete(r.ref));
  const failed=results.filter(r=>!r.ok);
  dashPersistBackup(); updateDashUnsaved();
  if(failed.length) throw new Error(failed.length+' change(s) failed: '+failed.map(f=>f.error).join('; '));
}
// Explicit Save button — save deliberately without leaving the page. This is
// the reliable save path; the leave-prompt and localStorage backup remain
// as safety nets (and a hard refresh can only ever show the browser's own
// warning, never a custom dialog, so an explicit button is essential).
async function dashSaveNow(){
  if(!dashPending.size) return;
  const btn=document.getElementById('dashSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{ await saveAllDash(); }
  catch(e){ updateDashUnsaved(); alert('Some changes could not be saved: '+e.message); return; }
  updateDashUnsaved();
  const el=document.getElementById('dashUnsaved');
  if(el){ el.style.display=''; el.style.color='var(--green,#2a9d54)'; el.textContent='✓ Saved'; setTimeout(()=>updateDashUnsaved(),1600); }
}

// ── Add the current filter to a playlist ──────────────────────
// Turns every event in `filtered` into a clip (anchored to driveT, the main
// angle's video position; start/end carry only the duration) and appends
// them to a chosen playlist — the dashboard's "filter → watch" loop.
async function dashAuthFetchPL(payload){
  const ni=window.netlifyIdentity;
  const cu=ni&&((ni.gotrue&&ni.gotrue.currentUser&&ni.gotrue.currentUser())||(ni.currentUser&&ni.currentUser()));
  let t=(cu&&cu.jwt?await cu.jwt().catch(()=>null):null)||(cu&&cu.token&&cu.token.access_token);
  if(!t&&ni&&ni.refresh){ try{ await ni.refresh(); const u=ni.gotrue.currentUser(); t=u&&u.token&&u.token.access_token; }catch(_){} }
  if(!t) throw new Error('Not signed in as admin — sign out and back in, then retry.');
  const res=await fetch('/.netlify/functions/playlists',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(payload)});
  const j=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
  return j;
}
function dashClipOf(e){
  // Capture from the angle the user is CURRENTLY watching: that angle's
  // video id, with times converted into its timeline. driveT (main-angle
  // reference) is kept on the clip so a future player can re-derive other
  // angles for the same moment.
  const idx=(GAME.angles&&GAME.angles[currentAngleIdx])?currentAngleIdx:0;
  const ang=(GAME.angles&&GAME.angles[idx])||null;
  const vid=(ang&&ang.youtubeId)||GAME.youtubeId||'';
  const s=Math.max(0,driveToAngle(e.driveT||0,idx));
  const dur=(e.end!=null&&e.start!=null)?Math.max(1,e.end-e.start):6;
  const clip={ videoId:vid, gameId:GAME.id, gameTitle:GAME.title||'', driveT:e.driveT||0,
           start:s, end:s+dur,
           label:(e.code||'Clip')+(e.player?' · '+e.player:''), code:e.code||'', player:e.player||'' };
  if(idx>0) clip.angle=(ang&&ang.label)||('Cam '+(idx+1));
  return clip;
}

async function dashRestoreBackup(){
  let raw; try{ raw=localStorage.getItem(dashBackupKey()); }catch(_){ return; }
  if(!raw) return;
  let bk; try{ bk=JSON.parse(raw); }catch(_){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  const entries=Object.entries(bk||{});
  if(!entries.length){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  const c=await cohesionModal({title:'Unsaved changes found', message:'You have '+entries.length+' unsaved tag change(s) from a previous session on this game. Restore them?', buttons:[{label:'Restore',value:'restore',primary:true},{label:'Discard',value:'discard',danger:true}]});
  if(c!=='restore'){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  entries.forEach(([id,data])=>{
    const ev=ALL.find(e=>String(e._rowId)===String(id));
    if(ev){ if('player' in data) ev.player=data.player; if('labels' in data) ev.labels=data.labels; if('outcome' in data) ev.outcome=data.outcome; dashPending.set(ev._rowId, data); }
  });

// Quick-tag custom label groups (Shooting Leg, Shot Side, …) beside Assign
// Player. Admin only. Options come from cohesion-config.js; the values write
// into the event's own labels, so they immediately become filters in the
// LABELS tab (which builds its groups dynamically from ev.labels).
// Assist (players:true group) choices: this game's team sheet for the
// shooting side (meta.rosters[side], string or object entries, then the
// admin's P-tag map playerRoster teamA=home / teamB=away), then every player
// tagged for that team in this game (player, "<TEAM> Player Labels", Assist
// values) — de-duplicated case/space-insensitively, shooter excluded.
// "Other…" prompts for any free name.
function dashAssistChoices(ev){
  const T=String(ev.team||'').toUpperCase();
  const side=T&&T===String(GAME.homeTeam||'').toUpperCase()?'home':'away';
  const key=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
  const tidy=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
  const seen=new Set(), out=[], me=key(ev.player); if(me) seen.add(me);
  const add=n=>{ const k=key(n); if(!k||seen.has(k)) return; seen.add(k); out.push(tidy(n)); };
  const list=GAME.rosters&&GAME.rosters[side];
  if(Array.isArray(list)) list.forEach(r=>add(r&&typeof r==='object'?(r.name!=null?r.name:r.player):r));
  const pr=GAME.playerRoster&&GAME.playerRoster[side==='home'?'teamA':'teamB'];
  if(pr&&typeof pr==='object'){ const num=k=>parseInt(String(k).replace(/\D/g,''),10)||0;
    Object.keys(pr).sort((a,b)=>num(a)-num(b)).forEach(k=>{ const v=tidy(pr[k]); if(v&&!/^P\s*\d+$/i.test(v)) add(v); }); }
  const tagged=[];
  ALL.forEach(x=>{ if(String(x.team||'').toUpperCase()!==T) return; if(x.player) tagged.push(x.player);
    const L=x.labels||{}; Object.keys(L).forEach(k=>{ if(L[k]&&(k.toUpperCase()===T+' PLAYER LABELS'||k==='Assist')) tagged.push(L[k]); }); });
  tagged.map(tidy).sort((a,b)=>a.localeCompare(b)).forEach(add);
  return out;
}
function renderCustomTags(ev){
  const wrap=document.getElementById('NPCustom'); if(!wrap)return;
  const groups=(window.cohesionGroupsFor?window.cohesionGroupsFor(ev.code):[]);

    let choices=(g.options||[]).slice();
    if(g.players){                                   // Assist: team sheet + this game's players, minus the shooter
      choices=dashAssistChoices(ev);

    }
    const opts=[`<option value="">${esc(g.name)}…</option>`].concat(choices.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o)}</option>`))
      .concat(g.players?[`<option value="__other__">Other…</option>`]:[]).join('');
    return `<div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
      <span style="font:700 10px 'Barlow Condensed',sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;min-width:82px;">${esc(g.name)}</span>
      <select data-group="${esc(g.name)}" data-row="${esc(String(ev._rowId))}" onchange="dashCustomTagChange(this)" style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--t1);padding:4px 6px;font:12px Barlow,sans-serif;outline:none;">${opts}</select>
    </div>`;
  }).join('');
}
function dashCustomTagChange(sel){
  const ev=ALL.find(e=>String(e._rowId)===String(sel.dataset.row)); if(!ev){alert('Event reference missing.');return;}
  let v=sel.value;
  if(v==='__other__'){
    v=String(prompt('Assist — player name:')||'').replace(/\s+/g,' ').trim();
    if(!v){ renderCustomTags(ev); return; }          // cancelled: restore the select
  }
  saveCustomTag(ev._rowId, sel.dataset.group, v);
  renderCustomTags(ev);
}
function saveCustomTag(rowId,group,value){
  const ev=ALL.find(e=>e._rowId===rowId); if(!ev){alert('Event reference missing.');return;}
  const labels={...(ev.labels||{})};
  if(value==='') delete labels[group]; else labels[group]=value;
  ev.labels=labels;
  queueEventEdit(ev);
}
const HH=[315,400,520,700];
function setH(h){
  document.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('on',HH[i]===h));
  const v=document.getElementById('VA');if(v)v.style.height=h+'px';
}
function goFS(){const el=document.getElementById('VA');const r=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(r)r.call(el);else{const ang=GAME.angles?GAME.angles[currentAngleIdx]:GAME;window.open(`https://www.youtube.com/watch?v=${ang.youtubeId}&t=${curT}s`,'_blank','noopener');}}
/* ── Video controls bar ── */
function vcSeek(delta){if(!YTP||!YTP.seekTo)return;const t=Math.max(0,(YTP.getCurrentTime?YTP.getCurrentTime():0)+delta);YTP.seekTo(t,true);}
function vcTogglePlay(){if(!YTP)return;const s=YTP.getPlayerState?YTP.getPlayerState():-1;if(s===1)YTP.pauseVideo();else YTP.playVideo();}
function vcPrevEv(){
  const cur=YTP&&YTP.getCurrentTime?videoTimeToDrive(YTP.getCurrentTime(),currentAngleIdx):curT;
  const pool=activeCode?filtered.filter(e=>e.code===activeCode):filtered;
  const prev=pool.filter(e=>e.driveT<cur-0.5).sort((a,b)=>b.driveT-a.driveT)[0];
  if(prev)pickI(prev.id);
}
function vcNextEv(){
  const cur=YTP&&YTP.getCurrentTime?videoTimeToDrive(YTP.getCurrentTime(),currentAngleIdx):curT;
  const pool=activeCode?filtered.filter(e=>e.code===activeCode):filtered;
  const next=pool.filter(e=>e.driveT>cur+0.5).sort((a,b)=>a.driveT-b.driveT)[0];
  if(next)pickI(next.id);
}
function fmtVC(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60);}
function updateVCTime(){
  const el=document.getElementById('vcTime');if(!el)return;
  const cur=YTP&&YTP.getCurrentTime?YTP.getCurrentTime():0;
  const dur=YTP&&YTP.getDuration?YTP.getDuration():0;
  el.textContent=fmtVC(cur)+' / '+fmtVC(dur);
}
function updateVCPlay(){
  const btn=document.getElementById('vcPlay');if(!btn)return;
  const s=YTP&&YTP.getPlayerState?YTP.getPlayerState():-1;
  btn.textContent=s===1?'⏸':'▶';
}
/* Patch startRAF / stopRAF to also update controls */
const _origStart=startRAF;
function startRAF(){_origStart();updateVCPlay();}
const _origStop=stopRAF;
function stopRAF(){_origStop();updateVCPlay();}
/* Arrow key + Space shortcuts */
document.addEventListener('keydown',function(e){
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){e.preventDefault();vcSeek(-5);}
  else if(e.key==='ArrowRight'){e.preventDefault();vcSeek(5);}
  else if(e.key===' '){e.preventDefault();vcTogglePlay();}
});
/* Update time display every second */
setInterval(()=>{updateVCTime();updateVCPlay();},1000);
function initDH(){
  const h=document.getElementById('DH'),v=document.getElementById('VA');if(!h||!v)return;
  let dr=false,sy=0,sh=0;
  h.addEventListener('mousedown',e=>{dr=true;sy=e.clientY;sh=v.offsetHeight;h.classList.add('act');document.body.style.cursor='ns-resize';document.body.style.userSelect='none';});
  document.addEventListener('mousemove',e=>{if(!dr)return;const maxH=window.innerHeight-120;const nh=Math.max(120,Math.min(maxH,sh+(e.clientY-sy)));v.style.height=nh+'px';document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));});
  document.addEventListener('mouseup',()=>{if(!dr)return;dr=false;h.classList.remove('act');document.body.style.cursor='';document.body.style.userSelect='';});
}
function initTL(){
  const c=document.getElementById('tlC');if(!c)return;
  function sync(){c.width=c.offsetWidth;drawTL();}
  sync();new ResizeObserver(sync).observe(c);
  c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const x=e.clientX-r.left;const t=tlO+(x/c.width)*(tlDur/tlZ);seekV(Math.max(0,t));});
  c.addEventListener('wheel',e=>{e.preventDefault();const r=c.getBoundingClientRect();const x=e.clientX-r.left;const tm=tlO+(x/c.width)*(tlDur/tlZ);if(e.deltaY<0)tlZ=Math.min(12,tlZ*1.5);else tlZ=Math.max(1,tlZ/1.5);tlO=tm-(x/c.width)*(tlDur/tlZ);tlO=Math.max(0,Math.min(tlDur-tlDur/tlZ,tlO));drawTL();},{passive:false});
  // Tooltip on hover
  const tip=document.getElementById('tlTip');
  const RH=24,RG=2,RT=4,LW=16;
  c.addEventListener('mousemove',e=>{
    if(!tip||!filtered.length)return;
    const r=c.getBoundingClientRect();
    const sx=c.width/r.width;
    const mx=(e.clientX-r.left)*sx;
    const my=(e.clientY-r.top)*sx;
    const vD=tlDur/tlZ;
    const hY=RT,aY=RT+RH+RG;
    let found=null;
    for(const ev of filtered){
      const x=((ev.driveT-tlO)/vD)*c.width;
      const w=Math.max(3,((ev.end-ev.start)/vD)*c.width);
      const iH=ev.team.toUpperCase()===(GAME.homeTeam||'').toUpperCase();
      const y=iH?hY:aY;
      if(mx>=Math.max(LW,x)&&mx<=Math.max(LW,x)+w&&my>=y&&my<=y+RH){found=ev;break;}
    }
    if(found){
      const parts=[found.player,found.outcome?tc(found.outcome):'',found.subtype?tc(found.subtype):''].filter(Boolean);
      document.getElementById('tltCode').textContent=tc(found.code);
      document.getElementById('tltDetail').textContent=parts.join(' · ')||'—';
      document.getElementById('tltTime').textContent=found.gameTime;
      // Position: right of cursor, flip left if near edge
      const tx=e.clientX+14,tw=220;
      tip.style.left=(tx+tw>window.innerWidth?e.clientX-tw-8:tx)+'px';
      tip.style.top=Math.max(8,e.clientY-50)+'px';
      tip.style.display='block';
    } else {
      tip.style.display='none';
    }
  });
  c.addEventListener('mouseleave',()=>{if(tip)tip.style.display='none';});
}
function setTP(p){
  tlPeriod=p;document.querySelectorAll('.tl-pb').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const h1=GAME.half1Start||103,h2=GAME.half2Start||2289;
  const et1=GAME.et1Start,et2=GAME.et2Start;
  if(p==='1h'){tlO=h1;tlZ=tlDur/(h2-h1);}
  else if(p==='2h'){tlO=h2;tlZ=tlDur/((et1||tlDur)-h2+60);}
  else if(p==='et1'&&et1){tlO=et1;tlZ=tlDur/((et2||tlDur)-et1+60);}
  else if(p==='et2'&&et2){tlO=et2;tlZ=tlDur/(tlDur-et2+60);}
  else{tlO=0;tlZ=1;}
  drawTL();
}
function zTL(d){const c2=tlO+(tlDur/tlZ)/2;if(d>0)tlZ=Math.min(12,tlZ*1.5);else tlZ=Math.max(1,tlZ/1.5);tlO=c2-(tlDur/tlZ)/2;tlO=Math.max(0,Math.min(tlDur-tlDur/tlZ,tlO));drawTL();}
function drawTL(){
  const c=document.getElementById('tlC');if(!c)return;
  const ctx=c.getContext('2d'),W=c.width,H=c.height;if(!W||!H)return;
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const vD=tlDur/tlZ,vE=tlO+vD;
  function xF(t){return((t-tlO)/vD)*W;}
  ctx.fillStyle=dark?'#1a1a24':'#e4e2df';ctx.fillRect(0,0,W,H);
  const RH=24,RG=2,RT=4,LW=16;
  const hY=RT,aY=RT+RH+RG;
  ctx.fillStyle=dark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';
  ctx.fillRect(0,hY,W,RH);ctx.fillRect(0,aY,W,RH);
  ctx.fillStyle=dark?'rgba(255,255,255,0.22)':'rgba(0,0,0,0.28)';
  ctx.font='bold 8px sans-serif';
  ctx.fillText((GAME.homeTeam||'Home').toUpperCase().slice(0,3),2,hY+15);
  ctx.fillText((GAME.awayTeam||'Away').toUpperCase().slice(0,3),2,aY+15);
  const h1=GAME.half1Start||103,h2=GAME.half2Start||2289;
  // Period shading
  const h1x=Math.max(LW,xF(h1)),h2x=Math.max(LW,xF(h2));
  ctx.fillStyle=dark?'rgba(79,195,247,0.04)':'rgba(3,105,161,0.04)';
  ctx.fillRect(h1x,hY,Math.max(0,h2x-h1x),RH);ctx.fillRect(h1x,aY,Math.max(0,h2x-h1x),RH);
  ctx.fillStyle=dark?'rgba(79,195,247,0.07)':'rgba(3,105,161,0.07)';
  ctx.fillRect(h2x,hY,Math.max(0,W-h2x),RH);ctx.fillRect(h2x,aY,Math.max(0,W-h2x),RH);
  // Events
  const hC=GAME.homeColor||'#2563eb',aC=GAME.awayColor||'#22c55e';
  filtered.forEach(ev=>{
    const x=xF(ev.driveT),w=Math.max(3,((ev.end-ev.start)/vD)*W);
    if(x+w<LW||x>W)return;
    const iH=ev.team.toUpperCase()===(GAME.homeTeam||'').toUpperCase(),y=iH?hY:aY;
    ctx.fillStyle=ev.id===activeId?'#fff':(iH?hC:aC);
    ctx.globalAlpha=ev.id===activeId?1:0.82;
    const bx=Math.max(LW,x),bw=Math.max(1,Math.min(x+w,W)-bx);ctx.fillRect(bx,y+2,bw,RH-4);
    ctx.globalAlpha=1;
  });
  // Markers
  function mk(t,col,lbl,lw,dash){
    const x=xF(t);if(x<LW||x>W)return;
    ctx.strokeStyle=col;ctx.lineWidth=lw||1.5;
    ctx.setLineDash(dash||[]);
    ctx.beginPath();ctx.moveTo(x,RT);ctx.lineTo(x,RT+RH*2+RG);ctx.stroke();
    ctx.setLineDash([]);
    if(lbl){ctx.fillStyle=col;ctx.font='bold 9px sans-serif';ctx.fillText(lbl,x+2,RT+9);}
  }
  mk(h1,'rgba(56,189,248,0.9)','1H',2);
  mk(h2,'rgba(56,189,248,0.9)','2H',2);
  if(GAME.et1Start)mk(GAME.et1Start,'rgba(56,189,248,0.9)','Et1',2);
  if(GAME.et2Start)mk(GAME.et2Start,'rgba(56,189,248,0.9)','Et2',2);
  // Throw-ins (from raw ALL data - not filtered)
  ALL.filter(e=>e.code==='THROW-IN').forEach(ev=>{mk(ev.driveT,'rgba(192,132,252,0.6)',null,1,[2,3]);});
  // Time labels
  const LY=RT+RH*2+RG+13;
  const li=vD>3600?600:vD>1800?300:vD>900?120:60;
  const fl=Math.ceil(tlO/li)*li;
  ctx.fillStyle=dark?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.3)';
  ctx.font='9px sans-serif';
  for(let t=fl;t<vE;t+=li){
    const x=xF(t);
    if(x>LW+10&&x<W-10)ctx.fillText(fmt(t),x-10,LY);
  }
  // Playhead
  if(vidT>0){
    const px=xF(vidT);
    if(px>=LW&&px<=W){
      ctx.strokeStyle=dark?'rgba(255,255,255,0.88)':'rgba(0,0,0,0.65)';
      ctx.lineWidth=2;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(px,RT);ctx.lineTo(px,RT+RH*2+RG);ctx.stroke();
      ctx.fillStyle=dark?'rgba(255,255,255,0.88)':'rgba(0,0,0,0.65)';
      ctx.beginPath();ctx.moveTo(px-4,RT);ctx.lineTo(px+4,RT);ctx.lineTo(px,RT+7);ctx.fill();
    }
  }
}
function updatePH(t){
  vidT=t;
  const vD=tlDur/tlZ,pct=(t-tlO)/vD;
  if(pct>0.9){tlO=t-vD*0.8;tlO=Math.max(0,Math.min(tlDur-vD,tlO));}
  else if(pct<0.05&&tlO>0){tlO=Math.max(0,t-vD*0.15);}
  drawTL();
}
function tc(s){if(!s)return'';return s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());}
function fmt(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
// ── Auto fullscreen on landscape rotation (mobile only) ──────────
window.addEventListener('orientationchange',function(){
  setTimeout(function(){
    // Only trigger on portrait-width devices
    if(Math.min(screen.width,screen.height)>900)return;
    const isLand=window.innerWidth>window.innerHeight;
    const va=document.getElementById('VA');
    if(!va)return;
    if(isLand){
      const rfs=va.requestFullscreen||va.webkitRequestFullscreen||va.mozRequestFullScreen;
      if(rfs)rfs.call(va).catch(function(){});
    } else {
      const ef=document.exitFullscreen||document.webkitExitFullscreen;
      if(ef&&(document.fullscreenElement||document.webkitFullscreenElement))ef.call(document).catch(function(){});
    }
  },250);
});
loadGame();
</script>

  <div class="tlt-code" id="tltCode"></div>
  <div class="tlt-detail" id="tltDetail"></div>
  <div class="tlt-time" id="tltTime"></div>
</div>
