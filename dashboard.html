<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COHESION — Match Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.youtube.com/iframe_api"></script>
<style>
[data-theme="dark"]{
  --bg:#181820;--panel:#1e1e28;--card:#252530;--hover:#2c2c3a;
  --border:rgba(255,255,255,0.08);--t1:#f0f0f5;--t2:#8888a0;--t3:#52526a;
  --accent:#4fc3f7;--accent-bg:rgba(79,195,247,0.1);--gold:#ffd700;--shadow:rgba(0,0,0,0.4);
  --score-bg:rgba(255,215,0,0.12);--won-bg:rgba(76,175,80,0.12);--lost-bg:rgba(244,67,54,0.12);
}
[data-theme="light"]{
  --bg:#f0eeeb;--panel:#ffffff;--card:#f7f6f3;--hover:#ebe9e5;
  --border:rgba(0,0,0,0.09);--t1:#1a1a28;--t2:#555572;--t3:#888899;
  --accent:#0369a1;--accent-bg:rgba(3,105,161,0.08);--gold:#b45309;--shadow:rgba(0,0,0,0.12);
  --score-bg:rgba(180,83,9,0.1);--won-bg:rgba(21,128,61,0.1);--lost-bg:rgba(185,28,28,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
@media(max-width:767px){html,body{height:auto;overflow-y:auto;}}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);display:flex;flex-direction:column;transition:background .2s,color .2s;}
header{height:50px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:100;}
.back-btn{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.5px;color:var(--t2);border:1px solid var(--border);background:var(--card);text-decoration:none;transition:all .15s;flex-shrink:0;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.game-title{font:600 13px 'Barlow Condensed',sans-serif;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.game-title strong{color:var(--t1);}
.hdr-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.hdr-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 9px;border-radius:6px;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.5px;color:var(--t2);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;white-space:nowrap;}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);}
.hdr-btn.round{width:32px;height:32px;padding:0;border-radius:50%;font-size:14px;}
main{flex:1;display:grid;grid-template-columns:380px 1fr;overflow:hidden;}
.left-panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
.view-toggle{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel);}
.vt-btn{flex:1;padding:8px 6px;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);background:none;border:none;cursor:pointer;transition:all .15s;border-bottom:2px solid transparent;}
.vt-btn.on{color:var(--accent);border-bottom-color:var(--accent);}
.vt-btn:hover:not(.on){color:var(--t2);}
.controls{padding:9px 11px 7px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-row{position:relative;margin-bottom:6px;}
.search-row input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:6px 10px 6px 28px;color:var(--t1);font:16px 'Barlow',sans-serif;outline:none;transition:border-color .2s;}
.search-row input:focus{border-color:var(--accent);}
.search-row input::placeholder{color:var(--t3);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;pointer-events:none;}
.filters-row{display:flex;gap:4px;margin-bottom:6px;}
select{flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 5px;color:var(--t1);font:14px 'Barlow',sans-serif;outline:none;cursor:pointer;}
select:focus{border-color:var(--accent);}
select option{background:var(--card);}
.chips-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px;}
.chip{padding:3px 10px;border-radius:20px;font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.4px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t2);transition:all .12s;white-space:nowrap;}
.chip:hover:not(.on){border-color:var(--t2);}
.chip.on{color:#fff;}
.chip[data-c="All"].on{background:#4fc3f7;border-color:#4fc3f7;}
.statbar{display:flex;gap:5px;margin-top:4px;}
.sp{background:var(--card);border-radius:4px;padding:2px 7px;font-size:13px;color:var(--t2);}
.sp b{color:var(--t1);}
.event-scroller{flex:1;overflow-y:auto;}
.lbl-active-bar{display:none;align-items:center;gap:6px;padding:5px 11px;background:var(--accent-bg);border-bottom:1px solid var(--border);font:600 10px 'Barlow Condensed',sans-serif;color:var(--accent);}
.lbl-active-bar.show{display:flex;}
.lbl-clear{cursor:pointer;padding:1px 5px;border-radius:3px;background:var(--card);border:1px solid var(--border);color:var(--t2);font-size:10px;margin-left:auto;}
.lbl-clear:hover{color:var(--t1);}
/* Events view */
.ev-group{border-bottom:1px solid var(--border);}
.ev-hdr{display:flex;align-items:center;padding:7px 10px;cursor:pointer;gap:6px;transition:background .1s;user-select:none;}
.ev-hdr:hover{background:var(--hover);}
.ev-arr{font-size:8px;color:var(--t3);width:10px;flex-shrink:0;transition:transform .15s;}
.ev-arr.o{transform:rotate(90deg);}
.ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ev-name{font:700 12px 'Barlow Condensed',sans-serif;flex:1;letter-spacing:.3px;}
.ev-cnt{font:700 10px 'Barlow Condensed',sans-serif;color:var(--accent);background:var(--accent-bg);padding:1px 6px;border-radius:10px;}
.ev-insts{background:var(--bg);}
.ev-inst{display:grid;grid-template-columns:76px 1fr;padding:7px 12px 7px 24px;border-top:1px solid var(--border);cursor:pointer;gap:5px;transition:background .1s;}
.ev-inst:hover{background:var(--card);}
.ev-inst.on{background:var(--card);border-left:2px solid var(--accent);padding-left:22px;}
.inst-t{font:700 17px 'Barlow Condensed',sans-serif;color:var(--accent);line-height:1.3;white-space:nowrap;}
.inst-vs{font-size:15px;color:var(--t3);}
.inst-b{min-width:0;}
.inst-pl{font:600 15px 'Barlow',sans-serif;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inst-sb{font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Labels view */
.lbl-group{border-bottom:1px solid var(--border);}
.lbl-hdr{display:flex;align-items:center;padding:7px 10px;cursor:pointer;gap:6px;transition:background .1s;user-select:none;}
.lbl-hdr:hover{background:var(--hover);}
.lbl-arr{font-size:8px;color:var(--t3);width:10px;flex-shrink:0;transition:transform .15s;}
.lbl-arr.o{transform:rotate(90deg);}
.lbl-gname{font:700 12px 'Barlow Condensed',sans-serif;flex:1;letter-spacing:.3px;}
.lbl-gcnt{font:700 10px 'Barlow Condensed',sans-serif;color:var(--t3);padding:1px 5px;border-radius:10px;background:var(--card);}
.lbl-vals{background:var(--bg);}
.lbl-val{display:flex;align-items:center;padding:5px 10px 5px 20px;border-top:1px solid var(--border);cursor:pointer;gap:5px;transition:background .1s;}
.lbl-val:hover{background:var(--card);}
.lbl-val.on{background:var(--accent-bg);border-left:2px solid var(--accent);padding-left:18px;}
.lbl-varr{font-size:7px;color:var(--t3);width:8px;flex-shrink:0;transition:transform .15s;}
.lbl-varr.o{transform:rotate(90deg);}
.lbl-vname{font:600 11px 'Barlow',sans-serif;color:var(--t2);flex:1;}
.lbl-vcnt{font:700 10px 'Barlow Condensed',sans-serif;color:var(--accent);}
.lbl-einsts{background:var(--bg);}
.lbl-einst{display:grid;grid-template-columns:52px 1fr;padding:4px 10px 4px 30px;border-top:1px solid var(--border);cursor:pointer;gap:5px;transition:background .1s;}
.lbl-einst:hover{background:var(--card);}
.lbl-einst.on{background:var(--card);border-left:2px solid var(--accent);}
.empty{padding:28px 14px;text-align:center;color:var(--t3);font-size:11px;}
/* stats tab */
.stt-teams{display:flex;justify-content:space-between;padding:10px 12px 4px;font:800 13px 'Barlow Condensed',sans-serif;letter-spacing:.5px;}
.stt-sec{padding:8px 12px 4px;border-bottom:1px solid var(--border);}
.stt-hd{font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.stt-sum{font-size:11px;color:var(--t2);margin-bottom:7px;display:flex;justify-content:space-between;gap:8px;}
.stt-row{display:grid;grid-template-columns:26px 1fr 108px 1fr 26px;align-items:center;gap:6px;margin-bottom:5px;}
.stt-n{font:700 11px 'Barlow Condensed',sans-serif;color:var(--t1);text-align:center;}
.stt-k{font-size:10px;color:var(--t2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stt-bar{height:9px;background:var(--card);border-radius:4px;overflow:hidden;display:flex;}
.stt-bar span{height:100%;border-radius:4px;}
.stt-bar.r{justify-content:flex-end;}
.stt-prow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--t1);margin-bottom:4px;}
.stt-prow span:last-child{text-align:right;}
.stt-none{font-size:11px;color:var(--t3);padding:2px 0 6px;}
.stt-note{padding:10px 12px 16px;font-size:10px;color:var(--t3);text-align:center;}
.stt-per{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 8px;border-bottom:1px solid var(--border);}
.stt-pc{padding:3px 9px;border-radius:5px;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.5px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t3);}
.stt-pc:hover{border-color:var(--accent);color:var(--accent);}
.stt-pc.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.stt-n.clk,.stt-k.clk{cursor:pointer;}
.stt-n.clk:hover,.stt-k.clk:hover{color:var(--accent);text-decoration:underline;}
/* Right panel */
.right-panel{display:flex;flex-direction:column;overflow-y:auto;background:var(--panel);}
.vid-toolbar{display:flex;align-items:center;padding:6px 10px;gap:5px;border-bottom:1px solid var(--border);flex-shrink:0;}
.size-grp{display:flex;gap:2px;}
.sbtn{padding:3px 8px;border-radius:5px;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.4px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t2);transition:all .12s;}
.sbtn:hover{border-color:var(--accent);color:var(--accent);}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="light"] .sbtn.on{color:#fff;}
.v-spacer{flex:1;}
.tbtn{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:6px;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.4px;cursor:pointer;transition:all .12s;text-decoration:none;white-space:nowrap;border:none;}
.tbtn-fs{background:var(--card);border:1px solid var(--border);color:var(--t2);}
.tbtn-fs:hover{border-color:var(--accent);color:var(--accent);}
.tbtn-yt{background:#ff0000;color:#fff;}
.tbtn-yt:hover{background:#cc0000;}
.vid-area{flex-shrink:0;background:#000;overflow:hidden;position:relative;}
#ytPlayerDiv{width:100%;height:100%;}
.vid-controls{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 10px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-shrink:0;}
.vc-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;cursor:pointer;color:var(--t2);background:var(--card);border:1px solid var(--border);font-size:13px;transition:all .12s;flex-shrink:0;user-select:none;}
.vc-btn:hover{color:var(--accent);border-color:var(--accent);}
.vc-btn.play{width:34px;height:34px;font-size:16px;color:var(--t1);border-color:var(--t3);}
.vc-btn.play:hover{color:var(--accent);border-color:var(--accent);}
.vc-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0;}
.vc-time{font:600 12px 'Barlow Condensed',sans-serif;color:var(--t2);letter-spacing:.3px;min-width:80px;text-align:center;}
.drag-handle{flex-shrink:0;height:8px;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:ns-resize;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.drag-handle:hover,.drag-handle.act{background:var(--accent-bg);}
.drag-handle::before{content:'';display:block;width:28px;height:2px;background:var(--t3);border-radius:1px;box-shadow:0 -3px 0 var(--t3),0 3px 0 var(--t3);}
.drag-handle:hover::before,.drag-handle.act::before{background:var(--accent);box-shadow:0 -3px 0 var(--accent),0 3px 0 var(--accent);}
.tl-section{flex-shrink:0;border-bottom:1px solid var(--border);}
.tl-bar{display:flex;align-items:center;padding:4px 8px;gap:5px;border-bottom:1px solid var(--border);background:var(--panel);}
.tl-pbtns{display:flex;gap:2px;}
.tl-pb{padding:2px 7px;border-radius:4px;font:700 9px 'Barlow Condensed',sans-serif;letter-spacing:.4px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t3);transition:all .12s;}
.tl-pb:hover{border-color:var(--t2);color:var(--t2);}
.tl-pb.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="light"] .tl-pb.on{color:#fff;}
.tl-sp{flex:1;}
.tl-leg{display:flex;align-items:center;gap:8px;}
.tl-li{display:flex;align-items:center;gap:3px;font:600 9px 'Barlow Condensed',sans-serif;color:var(--t3);}
.tl-ld{width:8px;height:8px;border-radius:2px;}
.tl-zbtns{display:flex;gap:2px;}
.tl-zb{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 13px 'Barlow Condensed',sans-serif;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t2);transition:all .12s;}
.tl-zb:hover{border-color:var(--accent);color:var(--accent);}
#tlTip{
  position:fixed;z-index:300;pointer-events:none;display:none;
  background:var(--panel);border:1px solid var(--border);border-radius:9px;
  padding:9px 13px;box-shadow:0 6px 24px var(--shadow);min-width:140px;max-width:220px;
}
.tlt-code{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.5px;color:var(--accent);margin-bottom:3px;}
.tlt-detail{font-size:11px;color:var(--t1);margin-bottom:2px;}
.tlt-time{font-size:10px;color:var(--t3);}
canvas#tlC{display:block;width:100%;cursor:crosshair;}
.now-playing{padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.np-lbl{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:2px;}
.np-name{font:800 14px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-meta{font-size:10px;color:var(--t2);margin-top:1px;}
.np-time{font:700 10px 'Barlow Condensed',sans-serif;color:var(--accent);margin-top:2px;}
.nearby{flex:1;overflow-y:auto;padding:6px 8px;}
.nb-lbl{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;padding:2px 4px 5px;}
.nbrow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;cursor:pointer;margin-bottom:1px;border:1px solid transparent;transition:background .1s;}
.nbrow:hover{background:var(--hover);border-color:var(--border);}
.nb-t{font:700 10px 'Barlow Condensed',sans-serif;color:var(--accent);min-width:58px;}
.nb-c{font-size:10px;color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px;}
.idle-icon{font-size:24px;opacity:.2;}
.idle-text{font-size:11px;color:var(--t3);line-height:1.9;}
.idle-text strong{color:var(--t2);}
.load-st{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3);font-size:12px;}
.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
@media(max-width:767px){
  main{display:flex;flex-direction:column;overflow:visible;height:auto;}
  .right-panel{order:-1;border-bottom:1px solid var(--border);}
  .left-panel{border-right:none;height:auto;display:flex;flex-direction:column;}
  .event-scroller{overflow-y:visible;flex:none;}
  .now-playing,.nearby,.idle,.tl-section{display:none;}
  .drag-handle{display:none;}
  .game-title{display:none;}
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('cohesion_theme',n);document.getElementById('TH').textContent=n==='dark'?'☀️':'🌙';drawTL();}

function normalizeAngles(){
  if(!GAME.angles||!GAME.angles.length){
    GAME.angles=[{label:'Main',youtubeId:GAME.youtubeId,half1Start:GAME.half1Start||0,half2Start:GAME.half2Start||0,et1Start:GAME.et1Start||null,et2Start:GAME.et2Start||null}];
  }
}
function driveToAngle(driveT,idx){
  if(idx===0||!GAME.angles)return driveT;
  const m=GAME.angles[0],t=GAME.angles[idx];
  let period,gck;
  if(m.et2Start&&driveT>=m.et2Start){period='et2';gck=driveT-m.et2Start;}
  else if(m.et1Start&&driveT>=m.et1Start){period='et1';gck=driveT-m.et1Start;}
  else if(driveT>=(m.half2Start||0)){period='2h';gck=driveT-(m.half2Start||0);}
  else{period='1h';gck=driveT-(m.half1Start||0);}
  const ts=period==='et2'?(t.et2Start??t.half2Start):period==='et1'?(t.et1Start??t.half2Start):period==='2h'?t.half2Start:t.half1Start;
  return Math.max(0,(ts||0)+gck);
}
// Maps a stored event's `half` field to the period key Visual Sync uses
// ('1st Half' -> '1H', etc.)
function mapHalfToVisualSyncPeriod(half){
  if(!half)return '1H';
  if(half.includes('ET')&&half.includes('2'))return 'ET2';
  if(half.includes('ET'))return 'ET1';
  if(half.includes('2'))return '2H';
  return '1H';
}
// Applies any saved Visual Sync correction to the Main angle's events.
// IMPORTANT: this must be added to ev.start (the untouched raw XML time,
// the same reference frame Visual Sync computed its offset against), NOT
// ev.driveT — driveT is already a transformed value (admin.html applies
// its own whistle-based period offset at upload time). Adding Visual
// Sync's offset to driveT compounds two different corrections and
// produces wildly wrong, often backward-shifted positions.
function applyVisualSyncCorrections(events){
  const segments = GAME.visualSync?.syncSegments?.main;
  if(!segments) return;
  events.forEach(ev=>{
    const periodKey = mapHalfToVisualSyncPeriod(ev.half);
    const segs = segments[periodKey];
    if(!segs || !segs.length) return;
    const offset = segs[segs.length-1].offset || 0;
    if(typeof ev.start === 'number'){
      ev.driveT = Math.max(0, Math.round(ev.start + offset));
    }
  });
}
function videoTimeToDrive(vt,idx){
  if(idx===0||!GAME.angles)return vt;
  const m=GAME.angles[0],t=GAME.angles[idx];
  let period,gck;
  if(t.et2Start&&vt>=t.et2Start){period='et2';gck=vt-t.et2Start;}
  else if(t.et1Start&&vt>=t.et1Start){period='et1';gck=vt-t.et1Start;}
  else if(vt>=(t.half2Start||0)){period='2h';gck=vt-(t.half2Start||0);}
  else{period='1h';gck=vt-(t.half1Start||0);}
  const ms=period==='et2'?(m.et2Start??m.half2Start):period==='et1'?(m.et1Start??m.half2Start):period==='2h'?m.half2Start:m.half1Start;
  return Math.max(0,(ms||0)+gck);
}
function setupAngleBtns(){
  const grp=document.getElementById('angleGrp');if(!grp)return;
  if(!GAME.angles||GAME.angles.length<2){grp.style.display='none';return;}
  grp.style.display='flex';

}
function switchAngle(idx){
  if(idx===currentAngleIdx)return;
  const curDrive=YTP&&YTP.getCurrentTime?videoTimeToDrive(YTP.getCurrentTime(),currentAngleIdx):curT;
  currentAngleIdx=idx;
  const ang=GAME.angles[idx];
  const tgtVT=driveToAngle(curDrive,idx);
  if(YTP&&YTP.loadVideoById){YTP.loadVideoById({videoId:ang.youtubeId,startSeconds:Math.max(0,tgtVT)});}
  document.querySelectorAll('#angleGrp .sbtn').forEach((b,i)=>b.classList.toggle('on',i===idx));
  const ytbEl=document.getElementById('YTB');if(ytbEl)ytbEl.href=`https://youtu.be/${ang.youtubeId}`;
}
function makeYTP(){
  if(!GAME.angles||!document.getElementById('ytPlayerDiv'))return;
  const ang=GAME.angles[currentAngleIdx]||GAME.angles[0];
  if(!ang||!ang.youtubeId)return;
  cohesionCreatePlayer({
    mount:'ytPlayerDiv',
    videoId:ang.youtubeId,
    playerVars:{start:Math.max(0,ang.half1Start||0),rel:0,fs:1,modestbranding:1,enablejsapi:1,origin:window.location.origin},
    onReady:function(p){YTP=p;tlDur=YTP.getDuration()||5400;if(pendSeek!==null){YTP.seekTo(pendSeek,true);YTP.playVideo();pendSeek=null;}drawTL();document.getElementById('ytFallback').style.display='none';},
    onStateChange:function(e){if(e.data===1)startRAF();else stopRAF();},
    onError:function(e){
      console.warn('YT Error:',e.data);
      // Show fallback on embedding error (error code 150 = blocked embedding)
      if(e.data===150||e.data===2){
        document.getElementById('ytPlayerDiv').style.display='none';
        document.getElementById('ytFallback').style.display='flex';
        const vid=(GAME.angles&&GAME.angles[currentAngleIdx||0]?.youtubeId)||GAME.youtubeId||'';
        document.getElementById('ytFallbackLink').href='https://youtu.be/'+vid;
      }

}

function startRAF(){stopRAF();function f(){if(YTP&&YTP.getCurrentTime){const vt=YTP.getCurrentTime();vidT=videoTimeToDrive(vt,currentAngleIdx);updatePH(vidT);}rafID=requestAnimationFrame(f);}rafID=requestAnimationFrame(f);}
function stopRAF(){if(rafID)cancelAnimationFrame(rafID);}
async function loadGame(){
  try{
    const bundle = await cohesionRead({ action:'gameBundle', id: gameId });
    GAME = bundle.meta || {};
    ALL  = (bundle.events || []).map(r => ({ ...r.data, _rowId: r.id }));
    applyVisualSyncCorrections(ALL);
    // The query has no ORDER BY, so rows arrive in physical table order —
    // which is only chronological by coincidence until any delete/reinsert
    // (re-parse, roster save, dedup) scrambles it. Sort into watch order
    // explicitly; nearby-event navigation in pickI() also relies on this.
    ALL.sort((a,b)=>(a.driveT??0)-(b.driveT??0)||(a.start??0)-(b.start??0));
    if(typeof dashRestoreBackup==='function'){ try{ await dashRestoreBackup(); }catch(_){} }
    buildPTM();init();
  }catch(e){
    document.getElementById('MA').innerHTML='<div class="load-st" style="text-align:center;padding:60px;color:var(--t3)"><div style="font-size:16px;color:var(--t2);margin-bottom:8px">Could not load match data</div><div style="font-size:12px">'+e.message+'</div></div>';
  }
}
function buildPTM(){
  ALL.forEach(ev=>{if(ev.player&&ev.team)PTM[ev.player]=ev.team;});
  ALL.forEach(ev=>{
    if(!ev.team){ev.team=PTM[ev.player]||PTM[ev.code]||'';}
    if(!ev.player&&PTM[ev.code]){ev.player=ev.code;}
  });
}

function populatePl(){
  const s=document.getElementById('FP');
  if(!s)return;
  const selectedTeam=document.getElementById('FT')?.value||'';
  const current=s.value;
  const players=[...new Set(
    ALL
      .filter(e => !selectedTeam || (e.team || '').toUpperCase() === selectedTeam.toUpperCase())
      .map(e => e.player)
      .filter(Boolean)
  )].sort();
  s.innerHTML='<option value="">All Players</option>';
  players.forEach(p=>{
    const o=document.createElement('option');
    o.value=p;
    o.textContent=p;
    s.appendChild(o);
  });
  if(players.includes(current)){
    s.value=current;
  }
}

function detectFormat(evs){
  if(!evs.length)return'gi';
  if(evs.some(e=>/\([PF]\)/.test(e.code)))return'giu';
  if(evs.some(e=>e.code===e.code.toUpperCase()&&/[A-Z]{2}/.test(e.code)))return'sc';
  return'gi';
}

function renderChips(){
  const catEl=document.getElementById('catChips');
  const subEl=document.getElementById('subChips');
  if(!catEl||!subEl)return;
  CHIP_FN_MAP={};SUB_FN_MAP={};
  (CHIP_DEFS[gameFormat]||[]).forEach(d=>{CHIP_FN_MAP[d.key]=d;});
  (SUB_DEFS[gameFormat]||[]).forEach(d=>{SUB_FN_MAP[d.key]=d;});
  // Category chips — only render if game has matching events
  const defs=(CHIP_DEFS[gameFormat]||[]).filter(d=>ALL.some(d.filter));
  let h=`<div class="chip on" data-c="All" onclick="setChip('All')">All</div>`;
  defs.forEach(d=>{h+=`<div class="chip" data-c="${d.key}" onclick="setChip('${d.key}')">${d.label}</div>`;});
  catEl.innerHTML=h;
  // Sub chips — only render if game has matching events
  const sdefs=(SUB_DEFS[gameFormat]||[]).filter(d=>ALL.some(d.filter));
  let sh='';sdefs.forEach(d=>{sh+=`<div class="chip" data-e="${d.key}" onclick="setSub('${d.key}')">${d.label}</div>`;});
  subEl.innerHTML=sh;
  subEl.style.display='none';
}
// ── Chip activation ───────────────────────────────────────────
function setChip(key){
  activeCatKey=key;
  activeCatFn=key==='All'?null:(CHIP_FN_MAP[key]?.filter||null);
  activeSubFn=null;activeSubKey='';
  const isShots=key==='shots';
  document.querySelectorAll('[data-c]').forEach(x=>{
    const on=x.dataset.c===key;
    x.classList.toggle('on',on);
    if(on&&key!=='All'){
      const d=CHIP_FN_MAP[key];
      if(d){x.style.background=d.color;x.style.borderColor=d.color;x.style.color=d.dark?'#000':'#fff';}
    }else{x.style.background='';x.style.borderColor='';x.style.color='';}
  });
  document.querySelectorAll('[data-e]').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.borderColor='';});
  const subEl=document.getElementById('subChips');
  if(subEl)subEl.style.display=(isShots&&subEl.children.length)?'':'none';
  applyF();
}
function setSub(key){
  if(activeSubKey===key){
    activeSubKey='';activeSubFn=null;
    document.querySelectorAll('[data-e]').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.borderColor='';});
  }else{
    activeSubKey=key;activeSubFn=SUB_FN_MAP[key]?.filter||null;
    document.querySelectorAll('[data-e]').forEach(x=>{
      const on=x.dataset.e===key;x.classList.toggle('on',on);

  const team=document.getElementById('FT')?.value||'';
  const player=document.getElementById('FP')?.value||'';
  const half=document.getElementById('FH')?.value||'';
  filtered=ALL.filter(ev=>{
    if(activeCatFn&&!activeCatFn(ev))return false;
    if(activeSubFn&&!activeSubFn(ev))return false;
    if(activeLF&&(!ev.labels||ev.labels[activeLF.g]!==activeLF.v))return false;
    if(team&&ev.team.toUpperCase()!==team.toUpperCase())return false;
    if(player&&ev.player!==player)return false;
    if(half&&ev.half!==half)return false;
    if(q&&!(ev.code+' '+ev.player+' '+ev.outcome+' '+ev.subtype+' '+ev.team+' '+ev.category).toLowerCase().includes(q))return false;
    return true;
  });
  // Update half filter options to include ET periods
  const halfSel=document.getElementById('FH');
  if(halfSel){
    const halfSet=new Set(ALL.map(e=>e.half).filter(Boolean));
    const opts=[...halfSel.querySelectorAll('option')];
    opts.forEach(o=>{if(o.value&&!halfSet.has(o.value))o.style.display='none';else if(o.value)o.style.display='';});
  }
  const ht=GAME.homeTeam||'';
  document.getElementById('CT').textContent=filtered.length.toLocaleString();
  document.getElementById('CH').textContent=filtered.filter(e=>e.team.toUpperCase()===(GAME.homeTeam||'').toUpperCase()).length;
  document.getElementById('CA').textContent=filtered.filter(e=>e.team.toUpperCase()===(GAME.awayTeam||'').toUpperCase()).length;
  renderP();drawTL();
}

// ── STATS TAB ─────────────────────────────────────────────────
// Whole-game numbers (from ALL events, ignoring the filter) for the groups
// carried in the XML: Shooting, Kickouts, Turnovers, Score Assists, Score
// Source. Everything is derived from label groups, so it works for any two
// teams that came through the parser.
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function statSide(e){ const t=(e.team||'').toUpperCase(); if(t===(GAME.homeTeam||'').toUpperCase())return 'h'; if(t===(GAME.awayTeam||'').toUpperCase())return 'a'; return null; }
// Period splits. Quarters come from the per-half game clock (Q1 = 1H before
// 18:00, Q2 = the rest, etc.); ET events only count under Full / ET chips.
let statPeriod='full';
function statQOf(e){ const m=/^([12])H\s+(\d+):/.exec(e.gameTime||''); if(!m)return null; const h=+m[1],min=+m[2]; return h===1?(min<18?'q1':'q2'):(min<18?'q3':'q4'); }
function statPred(e){
  switch(statPeriod){
    case 'full': return true;
    case '1h': return e.half==='1st Half';
    case '2h': return e.half==='2nd Half';
    case 'et1': return e.half==='ET 1st Half';
    case 'et2': return e.half==='ET 2nd Half';
    default: return statQOf(e)===statPeriod;
  }
}
function setStatPeriod(p){ statPeriod=p; renderSV(); }
// Different coding systems name their label groups differently (Sportscode
// family: "Shot Outcomes"; Gaelic Insights: "Outcome"/"PO_Result"/...).
// Each stat filters by event code and tries the group aliases in order.
function tallyOutcome(pred, groups){
  const out={h:{},a:{},totH:0,totA:0,group:''};
  ALL.forEach(e=>{ const s=statSide(e); if(!s)return; if(!statPred(e))return;
    if(pred&&!pred(e))return;
    let v=null,g=null;
    for(const cand of groups){ const val=(e.labels||{})[cand]; if(val){ v=val; g=cand; break; } }
    if(!v)return; if(!out.group) out.group=g;
    const b=s==='h'?out.h:out.a; b[v]=(b[v]||0)+1; if(s==='h')out.totH++; else out.totA++; });
  return out;
}
// Kickout retention across vocabularies: "KT Won ..." = kicking team kept it,
// "RT Won ..." = receiver won it (lost); otherwise plain WON-without-LOST.
function koWonCount(tal,side){
  const b=side==='h'?tal.h:tal.a;
  return Object.entries(b).reduce((s,[k,v])=>{
    const K=k.toUpperCase();
    const won=K.includes('RT ')?false:K.includes('KT ')?true:(K.includes('WON')&&!K.includes('LOST'));
    return s+(won?v:0); },0);
}
function codeCount(pred,side){ return ALL.filter(e=>statSide(e)===side&&statPred(e)&&pred(e)).length; }
// Click a stat row → jump to the Events tab filtered to those events.
// side: ''=both teams, 'h'/'a'=that team only. Quarters filter to the parent half.
function statNav(side, group, value){
  const ft=document.getElementById('FT');
  if(ft) ft.value = side==='h'?(GAME.homeTeam||''):side==='a'?(GAME.awayTeam||''):'';
  const fh=document.getElementById('FH');

    const map={'1h':'1st Half','2h':'2nd Half','et1':'ET 1st Half','et2':'ET 2nd Half','q1':'1st Half','q2':'1st Half','q3':'2nd Half','q4':'2nd Half'};
    fh.value=map[statPeriod]||'';
  }
  if(typeof populatePl==='function') populatePl();
  setVM('events');
  filterLbl(group, value);
}

function statRows(tal, group){
  const keys=[...new Set([...Object.keys(tal.h),...Object.keys(tal.a)])].sort((x,y)=>((tal.h[y]||0)+(tal.a[y]||0))-((tal.h[x]||0)+(tal.a[x]||0)));

  const hC=GAME.homeColor||'#2563eb', aC=GAME.awayColor||'#22c55e';

  return keys.map(k=>{
    const h=tal.h[k]||0, a=tal.a[k]||0, m=Math.max(h,a,1);
    const nav=side=>group?` onclick="statNav('${side}','${q(group)}','${q(k)}')" title="Show these events"`:'';
    return `<div class="stt-row${group?' nav':''}">
      <span class="stt-n${h?' clk':''}"${h?nav('h'):''}>${h||''}</span>
      <span class="stt-bar r"><span style="width:${(h/m)*100}%;background:${hC}"></span></span>

}

// Marker style: circle = open play, square = dead ball; colour by result
// (1pt white / 2pt orange / goal yellow / other outcome red / penalty purple).
function locShotGlyph(e){
  const code=(e.code||'').toUpperCase();
  const L=e.labels||{};
  const out=String(L['Shot Outcomes']||L['ShotOutcome']||L['Outcome']||e.outcome||'').toUpperCase();
  const all=(code+' '+out+' '+Object.values(e.labels||{}).join(' ')).toUpperCase();
  const shape=/DEADBALL|FREE|PENALTY|\b45\b|MARK/.test(code)?'square':'circle';
  let color='#c4c4c4';
  if(/PENALTY/.test(all)) color='#a855f7';
  else if(/GOAL/.test(out)) color='#ffd700';
  else if(/2 POINT|TWO POINT/.test(out)) color='#f97316';
  else if(/POINT/.test(out)) color='#ffffff';
  else if(out) color='#ef4444';
  return {shape,color};
}
let locMap={kind:'shot',team:'h'};
// Coordinates: native e.x/e.y first, else Match Tracker label pairs
// (X-Shot/Y-Shot, X-Shot_away, X-KOs, ...), 0-100 scale.
function dashCoordOf(e){
  if(e&&e.x!=null&&e.y!=null) return {x:e.x,y:e.y};
  const keys=Object.keys(e&&e.labels||{});
  for(const k of keys){
    const m=/^x([-_ ].*)$/i.exec(k); if(!m) continue;
    const yk=keys.find(k2=>/^y/i.test(k2)&&k2.slice(1).toLowerCase()===m[1].toLowerCase());
    if(!yk) continue;
    const x=parseFloat(e.labels[k]), y=parseFloat(e.labels[yk]);
    if(isFinite(x)&&isFinite(y)) return {x:Math.max(0,Math.min(100,x)),y:Math.max(0,Math.min(100,y))};
  }
  return null;
}
function locEvents(kind){
  return ALL.filter(e=>dashCoordOf(e) && (kind==='shot'?/SHOT/i.test(e.code||''):/KICKOUT|\bKO\b/i.test(e.code||'')));
}

// ── STATS IMAGE — the full-game stat card in the tracker app's exact format:
// crests (from an imported tracker team pack), wrapped equal-size names,
// scores+PSR, mirrored bars, scoring worm. Rows the source XML cannot fill
// (both sides zero) are hidden, as are fully-empty sections.
function cohPacksLoad(){ try{ return JSON.parse(localStorage.getItem('coh_team_packs'))||[]; }catch(_e){ return []; } }
function cohPacksStore(ts){ try{ localStorage.setItem('coh_team_packs', JSON.stringify(ts)); }catch(_e){} }
function cohPackTeam(name){ const n=String(name||'').trim().toLowerCase();
  return cohPacksLoad().find(t=>String(t.club||'').trim().toLowerCase()===n)||null; }
// Crest source: an imported team-pack crest wins; otherwise fall back to the
// bundled club crests in /crests (matched on an accent/spacing-insensitive slug).
function cohCrestSrc(name,pack){
  if(pack&&pack.crest) return pack.crest;
  const sl=String(name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  const M=window.COHESION_CRESTS||{};
  return M[sl]?('crests/'+M[sl]):null;
}
// Bundled default colour for a club (from the published team packs) — used
// only when the game has no colour set and no pack is imported on the device.
function cohTeamColourDefault(name){
  const sl=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  const C=window.COHESION_TEAM_COLOURS||{};
  return (C[sl]&&C[sl].primary)||null;
}
function cohImportTeamPack(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(String(rd.result||''));
      if(p.format!=='gaa-team-pack@1'||!Array.isArray(p.teams)) throw new Error('bad');
      const ts=cohPacksLoad();
      let added=0, updated=0;
      p.teams.forEach(t=>{ if(!t.club) return;
        const i=ts.findIndex(x=>String(x.club||'').toLowerCase()===String(t.club).toLowerCase());
        if(i>=0){ ts[i]=t; updated++; } else { ts.push(t); added++; } });
      cohPacksStore(ts);
      alert('Team pack "'+(p.name||'')+'" imported — '+added+' clubs added, '+updated+' updated. Crests and colours now appear on stats images.');
    }catch(_e){ alert('Not a tracker team-pack file (.json exported from the Pack Builder).'); }
  };
  rd.readAsText(f);
  ev.target.value='';
}
function dashComputeStats(){
  const lum=x=>{ try{ const n=parseInt(String(x).replace('#',''),16);
    return 0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255); }catch(_e){ return 0; } };
  const lighten=(x,f)=>{ try{ const n=parseInt(String(x).replace('#',''),16);
    const L=v=>Math.round(v+(255-v)*f);
    return '#'+((1<<24)+(L((n>>16)&255)<<16)+(L((n>>8)&255)<<8)+L(n&255)).toString(16).slice(1);
  }catch(_e){ return x; } };
  const wrapName=nm=>{ const w=String(nm||'').trim().split(/\s+/).filter(Boolean);
    if(w.length<2) return [nm||'—'];
    let best=null;
    for(let i=1;i<w.length;i++){ const l1=w.slice(0,i).join(' '), l2=w.slice(i).join(' ');
      const m=Math.max(l1.length,l2.length); if(!best||m<best.m) best={m,l1,l2}; }
    return [best.l1,best.l2]; };
  const initials=nm=>{ const w=String(nm||'?').trim().split(/\s+/).filter(Boolean);
    return (w.length>1?w.map(x=>x[0]).join(''):String(w[0]||'?').slice(0,3)).slice(0,3).toUpperCase(); };
  const up=s=>String(s||'').toUpperCase();

  const of=(s,re)=>ALL.filter(e=>statSide(e)===s&&re.test(e.code||''));
  const SHOT=/SHOT (OPEN|DEAD)/i;
  const shotOut=e=>up((e.labels||{})['Shot Outcomes']||(e.labels||{})['ShotOutcome']||(e.labels||{})['Outcome']||e.outcome||'');
  const isScoreOut=k=>(k.includes('POINT')||k.includes('GOAL'))&&!k.includes('DISALLOWED')&&!k.includes('ATTEMPT');
  const shots=s=>of(s,SHOT);
  const scored=s=>shots(s).filter(e=>isScoreOut(shotOut(e)));
  const scoreOf=s=>{ let g=0,p=0;
    scored(s).forEach(e=>{ const k=shotOut(e);
      if(k.includes('GOAL')) g++; else if(k.includes('2 POINT')||k.includes('TWO')) p+=2; else p++; });
    return {g,p,str:g+'-'+String(p).padStart(2,'0')}; };
  const psr=s=>{ const t=shots(s).length; return t?Math.round(scored(s).length/t*100)+'%':'—'; };
  const psrN=s=>{ const t=shots(s).length; return t?Math.round(scored(s).length/t*100):0; };
  const goalAtt=s=>{ const st=of(s,/GOAL ATTEMPT/i).length;
    return st||shots(s).filter(e=>/GOAL/i.test((e.labels||{})['Shot Attempts']||'')).length; };
  const KO=/KICKOUT|\bKO\b/i;
  const koOut=e=>up((e.labels||{})['Kickout Outcomes']||(e.labels||{})['KickoutOutcome']||(e.labels||{})['PO_Result']||e.outcome||'');

// ── MATCH REPORT PDF — the tracker's full report format, computed from the
// game's XML. Sections the XML cannot fill are hidden. Full game only.
function dashBuildWormCanvas(S,hHex,aHex){
  if(!S.hasWorm) return null;
  const W=1200,HH=420;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=HH;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,HH);
  const ML=56,MR=18,MT=16,MB=40;
  const pw=W-ML-MR, ph=HH-MT-MB;
  const evs=S.scoreEvts;
  const nowMin=Math.max(evs.length?evs[evs.length-1].min:0,S.h1len*2,10);
  let cH=0,cA=0;
  const pH=[{min:0,v:0}], pA=[{min:0,v:0}];
  evs.forEach(sv=>{ if(sv.s==='h'){cH+=sv.pts;pH.push({min:sv.min,v:cH});} else {cA+=sv.pts;pA.push({min:sv.min,v:cA});} });
  pH.push({min:nowMin,v:cH}); pA.push({min:nowMin,v:cA});
  const maxV=Math.max(cH,cA,5);
  const X=m=>ML+(m/nowMin)*pw, Y=v=>MT+ph-(v/maxV)*ph;
  ctx.strokeStyle='#d5dae2'; ctx.fillStyle='#4a5568';
  ctx.font='15px Helvetica,Arial,sans-serif'; ctx.textAlign='right'; ctx.lineWidth=1;
  const step=maxV<=10?2:maxV<=25?5:10;
  for(let v=0;v<=maxV;v+=step){
    ctx.beginPath(); ctx.moveTo(ML,Y(v)); ctx.lineTo(W-MR,Y(v)); ctx.stroke();
    ctx.fillText(v,ML-8,Y(v)+5);
  }
  ctx.textAlign='center';
  const xs=nowMin<=20?5:nowMin<=45?10:15;
  for(let m=0;m<=nowMin;m+=xs) ctx.fillText(Math.round(m)+"'",X(m),HH-16);
  const wl=h=>{ try{ const n=parseInt(String(h).replace('#',''),16);
    return 0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255); }catch(_e){ return 0; } };
  [[hHex,pH],[aHex,pA]].forEach(([col,pts])=>{
    if(wl(col)>=200){
      ctx.strokeStyle='#6a7080'; ctx.lineWidth=7; ctx.beginPath();
      pts.forEach((p,i)=>{ const x=X(p.min), yy=Y(p.v);
        if(i===0) ctx.moveTo(x,yy); else { ctx.lineTo(x,Y(pts[i-1].v)); ctx.lineTo(x,yy); } });
      ctx.stroke();
    }
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=4;
    ctx.beginPath();
    pts.forEach((p,i)=>{ const x=X(p.min), yy=Y(p.v);
      if(i===0) ctx.moveTo(x,yy); else { ctx.lineTo(x,Y(pts[i-1].v)); ctx.lineTo(x,yy); } });
    ctx.stroke();
    pts.slice(1,-1).forEach(p=>{ ctx.beginPath(); ctx.arc(X(p.min),Y(p.v),5,0,Math.PI*2); ctx.fill();
      if(wl(col)>=200){ ctx.strokeStyle='#6a7080'; ctx.lineWidth=1.2; ctx.stroke(); ctx.strokeStyle=col; } });
  });
  return cv;
}
// ── PDF pitch maps & charts ──────────────────────────────────────────
// Shot / kickout events with coordinates, plus per-team counts of events
// tagged WITHOUT a location (for the starred notes under the maps).
function dashMapData(){
  const up=s=>String(s||'').toUpperCase();
  const out={shots:[],kos:[],shotMiss:{h:0,a:0},koMiss:{h:0,a:0}};
  ALL.forEach(e=>{
    const s=statSide(e); if(!s) return;
    if(/SHOT (OPEN|DEAD)/i.test(e.code||'')){
      const k=up((e.labels||{})['Shot Outcomes']||(e.labels||{})['Outcome']||e.outcome||'');
      const att=up((e.labels||{})['Shot Attempts']||'');
      const scored=(k.includes('POINT')||k.includes('GOAL'))&&!k.includes('DISALLOWED')&&!k.includes('ATTEMPT');
      const shape=(att.includes('GOAL')||k==='GOAL')?'tri':(att.includes('2')||k.includes('2 POINT')||k.includes('TWO'))?'dia':'cir';
      const co=dashCoordOf(e);
      if(co) out.shots.push({s,x:co.x,y:co.y,scored,shape}); else out.shotMiss[s]++;
    } else if(/KICKOUT|\bKO\b/i.test(e.code||'')){
      const k=up((e.labels||{})['Kickout Outcomes']||(e.labels||{})['PO_Result']||e.outcome||'');
      if(!k) return;
      const won=k.includes('RT ')?false:k.includes('KT ')?true:(k.includes('WON')&&!k.includes('LOST'));
      const co=dashCoordOf(e);
      if(co) out.kos.push({s,x:co.x,y:co.y,won}); else out.koMiss[s]++;
    }
  });
  return out;
}
// Build one combined pitch map (both teams, team colours) as a canvas.
// kind 'shot': filled = scored, open = missed; circle 1pt, diamond 2pt,
// triangle goal. kind 'ko': dot = retained, X = lost.
function dashBuildMapCanvas(kind,hHex,aHex){
  const D=dashMapData();
  const yf=kind==='shot'?1:1, vbH=kind==='shot'?75:89;
  const evs=kind==='shot'?D.shots:D.kos;
  const colOf=s=>s==='h'?hHex:aHex;
  const marks=evs.map(m=>{
    const c=colOf(m.s), x=m.x, y=m.y*(kind==='shot'?0.75:0.89);
    if(kind==='ko'){
      if(m.won) return `<circle cx="${x}" cy="${y}" r="1.9" fill="${c}" stroke="#111" stroke-width=".45"/>`;
      return `<g stroke="#111" stroke-width="1.7"><line x1="${x-1.7}" y1="${y-1.7}" x2="${x+1.7}" y2="${y+1.7}"/><line x1="${x-1.7}" y1="${y+1.7}" x2="${x+1.7}" y2="${y-1.7}"/></g>`
        +`<g stroke="${c}" stroke-width="1"><line x1="${x-1.7}" y1="${y-1.7}" x2="${x+1.7}" y2="${y+1.7}"/><line x1="${x-1.7}" y1="${y+1.7}" x2="${x+1.7}" y2="${y-1.7}"/></g>`;
    }
    const fill=m.scored?c:'none', stroke=m.scored?'#111':c, sw=m.scored?'.45':'1';
    if(m.shape==='tri') return `<path d="M ${x} ${y-2.5} L ${x+2.3} ${y+1.8} L ${x-2.3} ${y+1.8} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    if(m.shape==='dia') return `<path d="M ${x} ${y-2.5} L ${x+2.3} ${y} L ${x} ${y+2.5} L ${x-2.3} ${y} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    return `<circle cx="${x}" cy="${y}" r="1.9" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  }).join('');
  const svg=locPitchSvg(kind)
    .replace(/ id="locSvg"/,'').replace(/ style="[^"]*"/,'')
    .replace('<g id="mapMarks"></g>','<g>'+marks+'</g>')
    .replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="600" height="'+Math.round(600*vbH/100)+'"');
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const W=640,MH=Math.round(600*vbH/100),LEG=64;
      const cv=document.createElement('canvas'); cv.width=W; cv.height=MH+LEG+20;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(im,20,6,600,MH);
      ctx.fillStyle='#555e6a'; ctx.font='600 17px Helvetica,Arial,sans-serif'; ctx.textAlign='left';
      const Hn=(GAME.homeTeam||'HOME').toUpperCase(), An=(GAME.awayTeam||'AWAY').toUpperCase();
      let lx=24, ly=MH+30;
      const dot=(c,filled)=>{ ctx.beginPath(); ctx.arc(lx+6,ly-5,6,0,Math.PI*2);
        if(filled){ ctx.fillStyle=c; ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=1; }
        else { ctx.strokeStyle=c; ctx.lineWidth=2; }
        ctx.stroke(); lx+=17; };
      const word=t=>{ ctx.fillStyle='#555e6a'; ctx.fillText(t,lx,ly); lx+=ctx.measureText(t).width+16; };
      if(kind==='shot'){
        dot(hHex,true); word(Hn); dot(aHex,true); word(An);
        ly+=24; lx=24;
        dot('#8a93a0',true); word('SCORED'); dot('#8a93a0',false); word('MISSED');
        word('● 1PT   ◆ 2PT   ▲ GOAL');
      } else {
        dot(hHex,true); word(Hn); dot(aHex,true); word(An);
        ly+=24; lx=24;
        dot('#8a93a0',true); word('RETAINED');
        ctx.strokeStyle='#8a93a0'; ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.moveTo(lx,ly-11); ctx.lineTo(lx+11,ly); ctx.moveTo(lx,ly); ctx.lineTo(lx+11,ly-11); ctx.stroke();
        lx+=17; word('LOST');
        ctx.font='600 13px Helvetica,Arial,sans-serif';
        word('TOP = KICKING GOAL · DASHED = HALFWAY');
      }
      res(cv);
    };
    im.onerror=()=>res(null);
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
// (a) Shot outcome mix — one stacked bar per team.

  y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...C_TEXT);
  const meta=[GAME.competition||'',GAME.round||'',GAME.date||''].filter(Boolean).join('  ·  ');
  doc.text(Hn+' v '+An+(meta?'   ·   '+meta:''),ML,y);
  y+=6;
  const box=(x,w,team,col,crest,sc,shots,scored,ps)=>{
    doc.setFillColor(246,248,252); doc.roundedRect(x,y,w,26,2,2,'F');
    let tx=x+4;
    if(crest){ try{ doc.addImage(crest,'PNG',x+3,y+5.5,15,15); tx=x+21; }catch(_e){} }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...col);
    doc.text(up(team),tx,y+8);
    doc.setFontSize(15); doc.setTextColor(...C_TEXT);
    doc.text(sc,tx,y+17);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...C_T2);
    doc.text(scored+'/'+shots+' shots  ·  PSR '+ps,tx,y+23);
  };
  box(ML,CW/2-2,Hn,colH,crImH,S.scH.str,S.shotsH,S.scoredH,S.psrH);
  box(ML+CW/2+2,CW/2-2,An,colA,crImA,S.scA.str,S.shotsA,S.scoredA,S.psrA);
  y+=32;

  // ── per-player scoring tables ──
  const shotEv=ALL.filter(e=>/SHOT (OPEN|DEAD)/i.test(e.code||''));
  const outOf=e=>up((e.labels||{})['Shot Outcomes']||(e.labels||{})['ShotOutcome']||(e.labels||{})['Outcome']||e.outcome||'');
  const anyPlayers=shotEv.some(e=>e.player);
  if(anyPlayers){
    secHead('Shooting by Player');
    [['h',Hn,colH],['a',An,colA]].forEach(([side,team,col])=>{
      const evs=shotEv.filter(e=>statSide(e)===side&&e.player);
      if(!evs.length) return;
      const m={};
      evs.forEach(e=>{ const p=m[e.player]||(m[e.player]={p1:0,p2:0,g:0,shots:0,scored:0});
        p.shots++;
        const k=outOf(e);
        if(k.includes('DISALLOWED')||k.includes('ATTEMPT')){}
        else if(k.includes('GOAL')){p.g++;p.scored++;}
        else if(k.includes('2 POINT')||k.includes('TWO')){p.p2++;p.scored++;}
        else if(k.includes('POINT')){p.p1++;p.scored++;}
      });
      const rows=Object.entries(m)
        .sort((x2,y2)=>(y2[1].g*3+y2[1].p2*2+y2[1].p1)-(x2[1].g*3+x2[1].p2*2+x2[1].p1))
        .map(([n,p])=>[n,p.p1||'—',p.p2||'—',p.g||'—',p.shots,p.scored,Math.round(p.scored/p.shots*100)+'%']);
      checkPage(22);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...col);
      doc.text(team+' Players',ML,y); y+=2;
      doc.autoTable({ startY:y, margin:{left:ML,right:MR},
        head:[['Player','1pt','2pt','Goal','Shots','Scored','%']], body:rows,
        styles:{fontSize:7.5,cellPadding:1.3},
        headStyles:{fillColor:hexToRgb(hexH&&side==='h'?hexH:hexA),
          textColor:rlum(hexToRgb(side==='h'?hexH:hexA))>=200?[30,30,40]:[255,255,255],
          lineColor:[180,180,190], lineWidth:rlum(hexToRgb(side==='h'?hexH:hexA))>=200?0.2:0, fontStyle:'bold'},
        theme:'grid' });
      y=doc.lastAutoTable.finalY+6;
    });
  }

  // ── shot & kickout maps — combined pitches, both teams in their colours ──
  const MD2=dashMapData();
  if(MD2.shots.length||MD2.kos.length){
    const [shotCv,koCv]=await Promise.all([
      MD2.shots.length?dashBuildMapCanvas('shot',hexH,hexA):null,
      MD2.kos.length?dashBuildMapCanvas('ko',hexH,hexA):null]);
    if(shotCv||koCv){
      const HW=(CW-6)/2;
      const hOf=cv=>cv?HW*cv.height/cv.width:0;
      const blockH=Math.max(hOf(shotCv),hOf(koCv));
      checkPage(blockH+30);
      secHead('Shot & Kickout Maps');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...C_TEXT);
      if(shotCv) doc.text('SHOT MAP — attacking up the page',ML,y+1);
      if(koCv)   doc.text('KICKOUT LANDING MAP',ML+HW+6,y+1);
      y+=3;
      if(shotCv) doc.addImage(shotCv.toDataURL('image/png'),'PNG',ML,y,HW,hOf(shotCv));
      if(koCv)   doc.addImage(koCv.toDataURL('image/png'),'PNG',ML+HW+6,y,HW,hOf(koCv));
      let ny=y+blockH+4;
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...C_T2);
      const noteTxt=(m,what)=>['h','a'].filter(s2=>m[s2]).map(s2=>(s2==='h'?Hn:An)+' '+m[s2]).join(' · ');
      if(MD2.shotMiss.h||MD2.shotMiss.a) doc.text('* '+noteTxt(MD2.shotMiss)+' shot'+((MD2.shotMiss.h+MD2.shotMiss.a)>1?'s':'')+' with no location tagged',ML,ny);
      if(MD2.koMiss.h||MD2.koMiss.a) doc.text('* '+noteTxt(MD2.koMiss)+' kickout'+((MD2.koMiss.h+MD2.koMiss.a)>1?'s':'')+' with no location tagged',ML+HW+6,ny);
      y=ny+6;
    }
  }

  // ── shot outcome mix + possession share ──
  {
    const mixCv=dashBuildShotMixCanvas(hexH,hexA);
    const dnCv=dashBuildPossDoughnut(hexH,hexA);
    if(mixCv||dnCv){
      const wMix=CW*0.62, wDn=CW*0.34;
      const hMix=mixCv?wMix*mixCv.height/mixCv.width:0;
      const hDn=dnCv?wDn*dnCv.height/dnCv.width:0;
      checkPage(Math.max(hMix,hDn)+18);
      secHead('Shot Outcomes & Possession');
      if(mixCv) doc.addImage(mixCv.toDataURL('image/png'),'PNG',ML,y,wMix,hMix);
      if(dnCv)  doc.addImage(dnCv.toDataURL('image/png'),'PNG',ML+wMix+6,y,wDn,hDn);
      y+=Math.max(hMix,hDn)+8;
    }
  }

  // ── kickout analysis ──
  const KOre=/KICKOUT|\bKO\b/i;
  const koOut2=e=>up((e.labels||{})['Kickout Outcomes']||(e.labels||{})['KickoutOutcome']||(e.labels||{})['PO_Result']||e.outcome||'');
  const koLoc=e=>up((e.labels||{})['Kickout Locations']||'');
  const anyKO=ALL.some(e=>KOre.test(e.code||'')&&koOut2(e));
  if(anyKO){
    secHead('Kickout Analysis');
    [['h',Hn,colH],['a',An,colA]].forEach(([side,team,col])=>{
      const own=ALL.filter(e=>statSide(e)===side&&KOre.test(e.code||'')&&koOut2(e));
      if(!own.length) return;
      const won=own.filter(e=>{ const k=koOut2(e);
        return k.includes('RT ')?false:k.includes('KT ')?true:(k.includes('WON')&&!k.includes('LOST')); }).length;
      checkPage(12);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...col);
      doc.text(team,ML,y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...C_TEXT);
      doc.text('Own KO: '+won+'/'+own.length+' won ('+Math.round(won/own.length*100)+'%)',ML+55,y);
      const locs=own.filter(e=>koLoc(e));
      if(locs.length){
        const s=locs.filter(e=>koLoc(e).includes('SHORT')).length;
        const md2=locs.filter(e=>koLoc(e).includes('MEDIUM')).length;
        const l=locs.filter(e=>koLoc(e).includes('LONG')).length;
        doc.setTextColor(...C_T2);
        doc.text('Short '+Math.round(s/locs.length*100)+'%  ·  Medium '+Math.round(md2/locs.length*100)+'%  ·  Long '+Math.round(l/locs.length*100)+'%',ML+110,y);
      }
      y+=6;
    });
    y+=2;
    // retention chart — by length and by half
    const retCv=dashBuildKoRetentionCanvas(hexH,hexA);
    if(retCv){
      const rh=CW*retCv.height/retCv.width;
      checkPage(rh+6);
      doc.addImage(retCv.toDataURL('image/png'),'PNG',ML,y,CW,rh);
      y+=rh+6;
    }
  }

  // ── match stats table (sections from the shared compute) ──
  if(S.sections.length){
    secHead('Match Stats');
    const body=[];
    S.sections.forEach(([title,rows])=>{
      body.push([{content:title,colSpan:3,styles:{fillColor:[235,240,247],textColor:[60,70,90],fontStyle:'bold',halign:'left'}}]);
      rows.forEach(r=>body.push([r.label,r.dH,r.dA]));
    });
    doc.autoTable({ startY:y, margin:{left:ML,right:MR},
      head:[['Stat',Hn,An]], body,
      styles:{fontSize:7.5,cellPadding:1.4},
      columnStyles:{1:{halign:'center'},2:{halign:'center'}},
      headStyles:{fillColor:C_ACC,textColor:[255,255,255],fontStyle:'bold'},
      theme:'grid' });
    y=doc.lastAutoTable.finalY+8;
  }

  // ── how the scores were built — points by source ──
  {
    const ssCv=dashBuildScoreSourceCanvas(hexH,hexA);
    if(ssCv){
      const sh=CW*ssCv.height/ssCv.width;
      checkPage(sh+16);
      secHead('How the Scores Were Built');
      doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(...C_T2);
      doc.text('Points by the source of the possession they came from',ML,y+1); y+=3;
      doc.addImage(ssCv.toDataURL('image/png'),'PNG',ML,y,CW,sh);
      y+=sh+6;
    }
  }

  // ── match momentum — directly under the possession/stats table ──
  const mom=dashBuildMomentumCanvas();
  if(mom){
    const mh=CW*mom.height/mom.width;
    checkPage(mh+22);
    secHead('Match Momentum');
    doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(...C_T2);
    doc.text('Momentum value per 2-min window — TO won: 1pt · Wide/Missed Shot: 2pts · 1-pointer: 3pts · 2-pointer: 4pts · Goal: 5pts   (up = '+Hn+', down = '+An+')',ML,y+2);
    y+=5;
    doc.addImage(mom.toDataURL('image/png'),'PNG',ML,y,CW,mh);
    y+=mh+4;
    // legend markers drawn as vector shapes (helvetica has no glyphs for these)
    doc.setFontSize(6.5); doc.setTextColor(...C_T2); doc.setLineWidth(0.25);
    const lx=ML+CW/2-30;
    doc.setDrawColor(0,61,45); doc.setFillColor(0,106,78);
    doc.circle(lx,y-1,1.6,'FD');
    doc.setDrawColor(255,255,255); doc.circle(lx,y-1,0.6,'S');
    doc.setDrawColor(85,85,85);
    doc.text('Goal',lx+3.2,y);
    const fx=lx+14;
    doc.setFillColor(249,115,22);
    doc.line(fx,y+1.2,fx,y-3.4);
    doc.triangle(fx,y-3.4,fx+3.4,y-2.2,fx,y-1,'FD');
    doc.text('2-pointer',fx+4.6,y);
    const gx=fx+25;
    doc.setFillColor(244,244,246); doc.setDrawColor(119,119,119);
    doc.line(gx,y+1.2,gx,y-3.4);
    doc.rect(gx,y-3.4,3,2.2,'FD');
    doc.text('1-pointer',gx+4.4,y);
    doc.setDrawColor(0,0,0);
    y+=6;
  }

  // ── scoring timeline ──
  const worm=dashBuildWormCanvas(S,hexH,hexA);
  if(worm){
    const wh=CW*worm.height/worm.width;
    checkPage(wh+16);
    secHead('Scoring Timeline');
    doc.addImage(worm.toDataURL('image/png'),'PNG',ML,y,CW,wh);
    y+=wh+8;
  }

  // ── player details (scores · shots · cards) ──
  const cardEv=ALL.filter(e=>/\bCARD\b/i.test(e.code||''));
  const involved=side=>{
    const m={};
    ALL.forEach(e=>{ if(statSide(e)!==side||!e.player) return;
      const p=m[e.player]||(m[e.player]={g:0,pts:0,shots:0,cards:[]});
      if(/SHOT (OPEN|DEAD)/i.test(e.code||'')){
        p.shots++;
        const k=outOf(e);
        if(k.includes('DISALLOWED')||k.includes('ATTEMPT')){}
        else if(k.includes('GOAL')) p.g++;
        else if(k.includes('2 POINT')||k.includes('TWO')) p.pts+=2;
        else if(k.includes('POINT')) p.pts++;
      }
      if(/\bCARD\b/i.test(e.code||'')){
        const cc=up((e.labels||{})['Card Outcomes']||'');
        p.cards.push(cc.includes('YELLOW')?'Y':cc.includes('BLACK')?'B':cc.includes('RED')?'R':'?');
      }
    });
    return m;
  };
  const anyDetail=['h','a'].some(s=>Object.keys(involved(s)).length);
  if(anyDetail){
    secHead('Player Details');
    [['h',Hn],['a',An]].forEach(([side,team])=>{
      const m=involved(side);
      const names=Object.keys(m); if(!names.length) return;
      const rows=names.sort().map(n=>{ const p=m[n];
        return [n,(p.g||p.pts)?p.g+'-'+p.pts:'—',p.shots||'—',p.cards.join(',')||'—']; });
      checkPage(20);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      doc.setTextColor(...(side==='h'?colH:colA));
      doc.text(up(team),ML,y); y+=2;
      doc.autoTable({ startY:y, margin:{left:ML,right:MR},
        head:[['Player','Score','Shots','Cards']], body:rows,
        styles:{fontSize:7.5,cellPadding:1.3},
        headStyles:{fillColor:hexToRgb(side==='h'?hexH:hexA),
          textColor:rlum(hexToRgb(side==='h'?hexH:hexA))>=200?[30,30,40]:[255,255,255],
          lineColor:[180,180,190], lineWidth:rlum(hexToRgb(side==='h'?hexH:hexA))>=200?0.2:0, fontStyle:'bold'},
        theme:'grid' });
      y=doc.lastAutoTable.finalY+6;
    });
  }

  // ── substitutions (numbers as recorded in the XML) ──
  const subEv=ALL.filter(e=>/\bSUB\b/i.test(e.code||'')&&(e.labels||{})['Sub Detail']);
  if(subEv.length){
    secHead('Substitutions');
    const rows=subEv.map(e=>[e.gameTime||'',statSide(e)==='h'?Hn:An,(e.labels||{})['Sub Detail']||'']);
    doc.autoTable({ startY:y, margin:{left:ML,right:MR},
      head:[['Time','Team','Substitution']], body:rows,
      styles:{fontSize:7.5,cellPadding:1.3},
      headStyles:{fillColor:C_ACC,textColor:[255,255,255],fontStyle:'bold'},
      theme:'grid' });
    y=doc.lastAutoTable.finalY+6;
  }

  const fname=(String(Hn)+'_v_'+String(An)+'_match_report.pdf').toLowerCase().replace(/[^\w.]+/g,'_');
  if(window.__pdfTest){ window.__pdfTest(doc,fname); return; }
  doc.save(fname);
}
function dashDlBlob(b,fname){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function renderSV(){
  const sc=document.getElementById('ES'); if(!sc)return;
  const H=tc(GAME.homeTeam||'Home'), A=tc(GAME.awayTeam||'Away');
  const hC=GAME.homeColor||'#2563eb', aC=GAME.awayColor||'#22c55e';
  let h=`<div class="stt-teams"><span style="color:${hC}">● ${H}</span><span style="color:${aC}">${A} ●</span></div>`;
  h+=`<div style="display:flex;gap:6px;margin:2px 0 8px;">
    <button class="tl-pb" style="flex:2;padding:9px;font-size:11px;cursor:pointer;" onclick="dashShareStatsCard()">📤 Download stats image</button>
    <button class="tl-pb" style="flex:1;padding:9px;font-size:11px;cursor:pointer;" onclick="dashExportPDF()" title="Stats card + momentum chart as a PDF">📄 PDF</button>
    <label class="tl-pb" style="flex:1;padding:9px;font-size:11px;cursor:pointer;text-align:center;" title="Import a tracker team-pack .json — its crests and colours appear on stats images">📦 Team Pack<input type="file" accept=".json,application/json" style="display:none" onchange="cohImportTeamPack(event)"></label>
  </div>`;

  // period chips (ET chips only when the game has ET events)
  const halves=new Set(ALL.map(e=>e.half).filter(Boolean));
  const chips=[['full','Full'],['1h','1st Half'],['2h','2nd Half'],['q1','Q1'],['q2','Q2'],['q3','Q3'],['q4','Q4']];
  if(halves.has('ET 1st Half')) chips.push(['et1','ET1']);
  if(halves.has('ET 2nd Half')) chips.push(['et2','ET2']);
  h+=`<div class="stt-per">${chips.map(([v,l])=>`<div class="stt-pc${statPeriod===v?' on':''}" onclick="setStatPeriod('${v}')">${l}</div>`).join('')}</div>`;

  const isShot=e=>/SHOT/i.test(e.code||'')||e.category==='Shots & Scores';
  const shots=tallyOutcome(isShot, ['Shot Outcomes','ShotOutcome','Outcome']);
  const scH=sumKeys(shots,'h',['POINT','GOAL']), scA=sumKeys(shots,'a',['POINT','GOAL']);
  h+=statSection('Shooting',
    `${shots.totH} shots · <b>${pct(scH,shots.totH)}</b> conversion &nbsp;|&nbsp; <b>${pct(scA,shots.totA)}</b> conversion · ${shots.totA} shots`,
    statRows(shots, shots.group||'Shot Outcomes'));

  const kos=tallyOutcome(e=>/KICKOUT|\bKO\b/i.test(e.code||'')||e.category==='Kickouts', ['Kickout Outcomes','KickoutOutcome','PO_Result']);
  const wonH=koWonCount(kos,'h'), wonA=koWonCount(kos,'a');
  h+=statSection('Kickouts',
    `${kos.totH} kickouts · <b>${pct(wonH,kos.totH)}</b> retained &nbsp;|&nbsp; <b>${pct(wonA,kos.totA)}</b> retained · ${kos.totA} kickouts`,
    statRows(kos, kos.group||'Kickout Outcomes'));

  const toRe=e=>/TURNOVER|\bTOS?\b/i.test(e.code||'')||e.category==='Turnovers';
  const tos=tallyOutcome(toRe, ['Turnover Outcomes','TurnoverOutcome','turnover_zone','Turnover Location']);
  h+=statSection('Turnovers', `${codeCount(toRe,'h')} won &nbsp;|&nbsp; ${codeCount(toRe,'a')} won`, statRows(tos, tos.group||'Turnover Outcomes'));

  const src=tallyOutcome(e=>isShot(e)||/SCORE SOURCE/i.test(e.code||''), ['Score Source Outcomes','Source']);
  h+=statSection('Score Source', '', statRows(src, src.group||'Score Source Outcomes'));

  // Score assists: dedicated codes/groups, or the GI 'Assist' label whose
  // VALUE is the assisting player's name.
  const assistName=e=>{ const a=(e.labels||{})['Assist']; if(a) return a; if(((e.labels||{})['Score Assist Outcomes'])||/SCORE ASSIST/i.test(e.code||'')) return e.player||'—'; return null; };
  const assists=ALL.filter(e=>statPred(e)&&assistName(e));
  const asH=assists.filter(e=>statSide(e)==='h'), asA=assists.filter(e=>statSide(e)==='a');
  const topP=list=>{const m={};list.forEach(e=>{const n=assistName(e);if(n&&n!=='—')m[n]=(m[n]||0)+1;});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,5);};
  const pRows=(l,r)=>{const n=Math.max(l.length,r.length); let out=''; for(let i=0;i<n;i++){ out+=`<div class="stt-prow"><span>${l[i]?esc(l[i][0])+' ('+l[i][1]+')':''}</span><span>${r[i]?esc(r[i][0])+' ('+r[i][1]+')':''}</span></div>`; } return out;};
  h+=statSection('Score Assists', `${asH.length} &nbsp;|&nbsp; ${asA.length}`, pRows(topP(asH),topP(asA)));

  const nShots=locEvents('shot').length, nKos=locEvents('ko').length;
  if(nShots||nKos){
    h+=statSection('Location Maps','',
      '<div style="display:flex;gap:8px;padding:2px 0 8px;">'
      +(nShots?'<button class="tl-pb" style="flex:1;padding:9px;font-size:11px;cursor:pointer;" onclick="openLocMap(\'shot\')">📍 Shot map ('+nShots+')</button>':'')
      +(nKos?'<button class="tl-pb" style="flex:1;padding:9px;font-size:11px;cursor:pointer;" onclick="openLocMap(\'ko\')">📍 Kickout map ('+nKos+')</button>':'')
      +'</div>');
  }
  h+=`<div class="stt-note">Click any number or outcome to see those events. Quarters split each half at 18:00 on the game clock.</div>`;
  sc.innerHTML=h;
}
function renderEV(){
  const sc=document.getElementById('ES');if(!sc)return;
  if(!filtered.length){sc.innerHTML='<div class="empty">No events match your filters</div>';return;}
  const grps={},ord=[];
  filtered.forEach(ev=>{if(!grps[ev.code]){grps[ev.code]=[];ord.push(ev.code);}grps[ev.code].push(ev);});
  let h='';
  ord.forEach((code,i)=>{
    const evs=grps[code],isO=EG.has(i);
    const tm=evs[0]?.team||'';
    const dc=tm===GAME.homeTeam?(GAME.homeColor||'#2563eb'):tm===GAME.awayTeam?(GAME.awayColor||'#22c55e'):'var(--t3)';
    h+=`<div class="ev-group"><div class="ev-hdr" onclick="togEG(${i})"><span class="ev-arr${isO?' o':''}">▶</span><div class="ev-dot" style="background:${dc}"></div><span class="ev-name">${tc(code)}</span><span class="ev-cnt">${evs.length}</span></div>`;
    if(isO){
      h+=`<div class="ev-insts">${evs.map(ev=>`<div class="ev-inst${ev.id===activeId?' on':''}" onclick="pickI('${ev.id}')"><div><div class="inst-t">${ev.gameTime}</div><div class="inst-vs">${fmt(ev.driveT)}</div></div><div class="inst-b"><div class="inst-pl">${ev.player||tc(ev.outcome)||'—'}</div><div class="inst-sb">${[ev.outcome?tc(ev.outcome):'',ev.subtype?tc(ev.subtype):''].filter(Boolean).join(' · ')}</div></div></div>`).join('')}</div>`;
    }
    h+='</div>';
  });
  sc.innerHTML=h;
}
function togEG(i){if(EG.has(i))EG.delete(i);else EG.add(i);renderEV();}
const LO=['Shot Outcomes','Tackle Outcomes','Game Involvement Outcomes','Kickout Outcomes','Turnover Outcomes','Turnover Location','Foul Areas','Mayo Player Labels','Score Source Outcomes','Score Source Score Outcomes','Score Assist Outcomes','Shot Attempts','Deadball Shot Type','Shot Zones','Kickout Locations','Kickout Zones','Card Outcomes','Team Name'];
function renderLV(){

      h+=`<div class="lbl-vals">${Object.entries(vals).sort((a,b)=>b[1].length-a[1].length).map(([val,evs])=>{const k=gn+'::'+val;const vO=LV.has(k);const isA=activeLF?.g===gn&&activeLF?.v===val;return`<div class="lbl-val${isA?' on':''}" onclick="hlv('${ea(gn)}','${ea(val)}')"><span class="lbl-varr${vO?' o':''}">▶</span><span class="lbl-vname">${tc(val)}</span><span class="lbl-vcnt">${evs.length}</span></div>${vO?`<div class="lbl-einsts">${evs.map(ev=>`<div class="lbl-einst${ev.id===activeId?' on':''}" onclick="pickI('${ev.id}')"><div><div class="inst-t">${ev.gameTime}</div><div class="inst-vs">${fmt(ev.driveT)}</div></div><div style="font-size:10px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${[ev.player,tc(ev.code)].filter(Boolean)[0]||''}</div></div>`).join('')}</div>`:''}`}).join('')}</div>`;

// Dashboard tag edits are BATCHED: each change updates the event in memory
// and a localStorage backup, then all changes push to the database in ONE
// authenticated call when the user leaves (the Save & leave prompt). Nothing
// is written per-keystroke. (Direct browser writes are blocked by RLS and
// fail silently anyway; batching goes through the service-role editEvent.)
let dashPending = new Map();               // rowId -> full event data to persist
function dashBackupKey(){ return 'coh_dash_'+gameId; }
function dashCleanEv(ev){ const d={...ev}; delete d._rowId; return d; }
function dashPersistBackup(){
  try{
    if(dashPending.size) localStorage.setItem(dashBackupKey(), JSON.stringify(Object.fromEntries(dashPending)));
    else localStorage.removeItem(dashBackupKey());
  }catch(_){}
}
function updateDashUnsaved(){
  const el=document.getElementById('dashUnsaved');
  const btn=document.getElementById('dashSaveBtn');
  const n=dashPending.size;
  if(el){ el.style.display = n ? '' : 'none'; el.style.color='var(--orange,#ff9800)'; el.textContent = n ? ('● '+n+' unsaved') : ''; }
  if(btn){ btn.style.display = n ? '' : 'none'; btn.disabled=false; btn.textContent='💾 Save ('+n+')'; }
}
function queueEventEdit(ev){ dashPending.set(ev._rowId, dashCleanEv(ev)); dashPersistBackup(); updateDashUnsaved(); }
async function saveAllDash(){
  if(!dashPending.size) return;
  const ops=[...dashPending.entries()].map(([id,data])=>({action:'update',id,data,ref:id}));
  const { results } = await cohesionEventBatch(ops);
  results.filter(r=>r.ok).forEach(r=>dashPending.delete(r.ref));
  const failed=results.filter(r=>!r.ok);
  dashPersistBackup(); updateDashUnsaved();
  if(failed.length) throw new Error(failed.length+' change(s) failed: '+failed.map(f=>f.error).join('; '));
}
// Explicit Save button — save deliberately without leaving the page. This is
// the reliable save path; the leave-prompt and localStorage backup remain
// as safety nets (and a hard refresh can only ever show the browser's own
// warning, never a custom dialog, so an explicit button is essential).
async function dashSaveNow(){
  if(!dashPending.size) return;
  const btn=document.getElementById('dashSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{ await saveAllDash(); }
  catch(e){ updateDashUnsaved(); alert('Some changes could not be saved: '+e.message); return; }
  updateDashUnsaved();
  const el=document.getElementById('dashUnsaved');
  if(el){ el.style.display=''; el.style.color='var(--green,#2a9d54)'; el.textContent='✓ Saved'; setTimeout(()=>updateDashUnsaved(),1600); }
}
function cohGo(t){ cohesionGuardedGo(t); return false; }
cohesionSetGuard(()=>dashPending.size>0, saveAllDash);

// ── Add the current filter to a playlist ──────────────────────
// Turns every event in `filtered` into a clip (anchored to driveT, the main
// angle's video position; start/end carry only the duration) and appends
// them to a chosen playlist — the dashboard's "filter → watch" loop.
async function dashAuthFetchPL(payload){
  const ni=window.netlifyIdentity;
  const cu=ni&&((ni.gotrue&&ni.gotrue.currentUser&&ni.gotrue.currentUser())||(ni.currentUser&&ni.currentUser()));
  let t=cu&&cu.token&&cu.token.access_token;
  if(!t&&ni&&ni.refresh){ try{ await ni.refresh(); const u=ni.gotrue.currentUser(); t=u&&u.token&&u.token.access_token; }catch(_){} }
  if(!t) throw new Error('Not signed in as admin — sign out and back in, then retry.');
  const res=await fetch('/.netlify/functions/playlists',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(payload)});
  const j=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
  return j;
}
function dashClipOf(e){
  // Capture from the angle the user is CURRENTLY watching: that angle's
  // video id, with times converted into its timeline. driveT (main-angle
  // reference) is kept on the clip so a future player can re-derive other
  // angles for the same moment.
  const idx=(GAME.angles&&GAME.angles[currentAngleIdx])?currentAngleIdx:0;
  const ang=(GAME.angles&&GAME.angles[idx])||null;
  const vid=(ang&&ang.youtubeId)||GAME.youtubeId||'';
  const s=Math.max(0,driveToAngle(e.driveT||0,idx));
  const dur=(e.end!=null&&e.start!=null)?Math.max(1,e.end-e.start):6;
  const clip={ videoId:vid, gameId:GAME.id, gameTitle:GAME.title||'', driveT:e.driveT||0,
           start:s, end:s+dur,
           label:(e.code||'Clip')+(e.player?' · '+e.player:''), code:e.code||'', player:e.player||'' };
  if(idx>0) clip.angle=(ang&&ang.label)||('Cam '+(idx+1));
  return clip;
}
async function dashAddToPlaylist(){
  const vid=(GAME.angles&&GAME.angles[0]&&GAME.angles[0].youtubeId)||GAME.youtubeId||'';
  if(!vid){ alert('This game has no video link.'); return; }
  const evs=filtered.slice();
  if(!evs.length){ alert('No events in the current filter.'); return; }
  if(evs.length>60 && !confirm('Add all '+evs.length+' filtered events as clips? That is a long playlist — consider narrowing the filter first.')) return;
  let lists=[];
  try{ const j=await dashAuthFetchPL({action:'list'}); lists=j.playlists||[]; }
  catch(e){ alert('Could not load playlists: '+e.message); return; }
  const angNote=(GAME.angles&&currentAngleIdx>0&&GAME.angles[currentAngleIdx])?' Clips use the camera you are watching now ('+((GAME.angles[currentAngleIdx].label)||('Cam '+(currentAngleIdx+1)))+').':'';
  const c=await cohesionPlaylistPicker(lists, {title:'Add '+evs.length+' clip'+(evs.length>1?'s':'')+' to…', message:'Every event in the current filter becomes a clip.'+angNote+' Rename or reorder them any time on the Playlists page.'});
  if(c==='cancel'||c==null) return;
  let target=null, name='', scope='club';
  if(c==='new'){
    name=(prompt('New playlist name:')||'').trim(); if(!name) return;
    const sc=await cohesionModal({title:'Who can see this playlist?', message:'Club-wide is visible to every analyst, coach and player; personal is only you.', buttons:[{label:'Club-wide',value:'club',primary:true},{label:'Just me',value:'personal'},{label:'Cancel',value:'cancel'}]});
    if(sc==='cancel') return; scope=sc;
  } else {
    target=lists.find(p=>'pl-'+p.id===c); if(!target) return;
    name=target.name; scope=target.scope;
  }
  const items=((target&&target.data&&target.data.items)||[]).concat(evs.map(dashClipOf));
  try{
    await dashAuthFetchPL({action:'save', id:target?target.id:undefined, name, scope, section: cohesionSection(), data:{items}});
    await cohesionModal({title:'Added ✓', message:evs.length+' clip'+(evs.length>1?'s':'')+' added to "'+name+'". Watch it on the Playlists page.', buttons:[{label:'OK',value:true,primary:true}]});
  }catch(e){ alert('Could not add to playlist: '+e.message); }
}
async function dashRestoreBackup(){
  let raw; try{ raw=localStorage.getItem(dashBackupKey()); }catch(_){ return; }
  if(!raw) return;
  let bk; try{ bk=JSON.parse(raw); }catch(_){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  const entries=Object.entries(bk||{});
  if(!entries.length){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  const c=await cohesionModal({title:'Unsaved changes found', message:'You have '+entries.length+' unsaved tag change(s) from a previous session on this game. Restore them?', buttons:[{label:'Restore',value:'restore',primary:true},{label:'Discard',value:'discard',danger:true}]});
  if(c!=='restore'){ try{localStorage.removeItem(dashBackupKey());}catch(__){} return; }
  entries.forEach(([id,data])=>{
    const ev=ALL.find(e=>String(e._rowId)===String(id));
    if(ev){ if('player' in data) ev.player=data.player; if('labels' in data) ev.labels=data.labels; if('outcome' in data) ev.outcome=data.outcome; dashPending.set(ev._rowId, data); }
  });
  updateDashUnsaved();
}

async function savePlayerTag(ev,name){
  if(!ev._rowId){alert('Could not save — missing event reference.');return;}
  // Player assignments live in their own dedicated "<TEAM> Player Labels"
  // group plus the display field — never sharing a slot with another label.
  // Queued in memory, not written until the batch save.
  const playerGroup=`${(ev.team||'').trim()||'Unassigned'} Player Labels`;
  ev.player=name;
  ev.labels={...(ev.labels||{}),[playerGroup]:name};
  queueEventEdit(ev);
  document.getElementById('NPM').textContent=[ev.gameTime,ev.player,tc(ev.outcome)].filter(Boolean).join(' · ');
  renderP();
}

// Quick-tag custom label groups (Shooting Leg, Shot Side, …) beside Assign
// Player. Admin only. Options come from cohesion-config.js; the values write
// into the event's own labels, so they immediately become filters in the
// LABELS tab (which builds its groups dynamically from ev.labels).
function renderCustomTags(ev){
  const wrap=document.getElementById('NPCustom'); if(!wrap)return;
  const groups=(window.cohesionGroupsFor?window.cohesionGroupsFor(ev.code):[]);
  if(!groups.length){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='block';
  wrap.innerHTML=groups.map(g=>{
    const val=(ev.labels&&ev.labels[g.name])||'';
    const opts=[`<option value="">${g.name}…</option>`].concat(g.options.map(o=>`<option${o===val?' selected':''}>${o}</option>`)).join('');
    return `<div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
      <span style="font:700 10px 'Barlow Condensed',sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;min-width:82px;">${g.name}</span>
      <select data-group="${g.name}" onchange="saveCustomTag(${ev._rowId},this.dataset.group,this.value)" style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--t1);padding:4px 6px;font:12px Barlow,sans-serif;outline:none;">${opts}</select>
    </div>`;
  }).join('');
}
function saveCustomTag(rowId,group,value){
  const ev=ALL.find(e=>e._rowId===rowId); if(!ev){alert('Event reference missing.');return;}
  const labels={...(ev.labels||{})};
  if(value==='') delete labels[group]; else labels[group]=value;
  ev.labels=labels;
  queueEventEdit(ev);
}
