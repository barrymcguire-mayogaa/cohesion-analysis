<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COHESION — Analysis</title>
<style>body{margin:0;background:#0b0b10;color:#a0a0ae;font-family:sans-serif;padding:24px;}a{color:#4fc3f7;}</style>
</head>
<body>
<p>Season Stats is now the Compare tab of <a id="go" href="analysis.html#compare">Analysis</a>.</p>
<script>
// Season Stats moved to analysis.html (Compare tab). Old links and bookmarks
// keep working: the query string is preserved, and so is a hash if one was
// given (otherwise the Compare tab is opened).
function ssRedirectTarget(loc){
  var h=String((loc&&loc.hash)||'');
  return 'analysis.html'+String((loc&&loc.search)||'')+(h&&h!=='#'?h:'#compare');
}
(function(){
  var t=ssRedirectTarget(window.location);
  var a=document.getElementById('go'); if(a) a.setAttribute('href',t);
  window.location.replace(t);
})();
</script>
</body>
</html>
