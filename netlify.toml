# Netlify Configuration for Cohesion Analysis

[build]
  command = ""
  publish = "."
  functions = "netlify/functions"
  # Ignore false-positive secret detection for public Supabase credentials
  # SUPABASE_URL and SUPABASE_KEY are public (used in browser code)
  # Only SUPABASE_SERVICE_ROLE_KEY is actually sensitive (server-side only)
  environment = { SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY" }

[dev]
  framework = "static"
  publish = "."

# Static site - serve files as-is, no SPA redirect needed
# This is NOT a single-page app, so don't redirect to index.html

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS are edited IN PLACE (not fingerprinted) — long caching would pin
# browsers to stale copies of cohesion-edit.js / cohesion-player.js.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CORS for team packs: the GAA Score Tracker (file:// or packaged app)
# fetches these static JSON files cross-origin.
[[headers]]
  for = "/packs/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
